<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphZo Editor v3.3 // CYBERPUNK FORMAT-SYNC</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Inter:wght@400;600&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-dark: #050508;
    --bg-panel: #0d0e17;
    --bg-input: #121320;
    --neon-cyan: #00f3ff;
    --neon-magenta: #ff0055;
    --neon-yellow: #fcee0a;
    --neon-green: #00ff66;
    --text-main: #e0e6ed;
    --text-dim: #7a8291;
    --border-glow: 0 0 8px rgba(0, 243, 255, 0.4);
    --border-magenta: 0 0 8px rgba(255, 0, 85, 0.4);
    --radius: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.03) 0%, transparent 80%),
      linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 24px 24px, 24px 24px;
  }

  header {
    background: linear-gradient(90deg, var(--bg-panel) 0%, rgba(255, 0, 85, 0.15) 100%);
    border-bottom: 2px solid var(--neon-magenta);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(255, 0, 85, 0.25);
    z-index: 10;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--neon-cyan);
    text-shadow: 0 0 12px var(--neon-cyan);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--neon-yellow);
    background: rgba(0, 0, 0, 0.4);
    padding: 6px 14px;
    border: 1px solid rgba(252, 238, 10, 0.3);
    border-radius: var(--radius);
  }

  .pulse {
    width: 10px;
    height: 10px;
    background: var(--neon-green);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--neon-green);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.25); }
    100% { opacity: 1; transform: scale(1); }
  }

  .main-container { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 330px;
    background: var(--bg-panel);
    border-right: 1px solid rgba(0, 243, 255, 0.2);
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex-shrink: 0;
  }

  .panel {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 243, 255, 0.3);
    padding: 14px;
    position: relative;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  }

  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    color: var(--neon-magenta);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px dashed rgba(255, 0, 85, 0.5);
    padding-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  label {
    display: block;
    font-size: 0.72rem;
    color: var(--neon-cyan);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid rgba(0, 243, 255, 0.4);
    color: var(--text-main);
    padding: 8px 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    margin-bottom: 10px;
    outline: none;
    transition: all 0.25s ease-in-out;
    border-radius: 2px;
  }

  input:focus, select:focus {
    border-color: var(--neon-cyan);
    box-shadow: var(--border-glow);
    background: #16182a;
  }

  .btn-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  button {
    background: transparent;
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    padding: 8px 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 2px;
  }

  button:hover { background: var(--neon-cyan); color: var(--bg-dark); box-shadow: var(--border-glow); }

  button.btn-magenta { border-color: var(--neon-magenta); color: var(--neon-magenta); }
  button.btn-magenta:hover { background: var(--neon-magenta); color: var(--bg-dark); box-shadow: var(--border-magenta); }

  button.btn-yellow { border-color: var(--neon-yellow); color: var(--neon-yellow); }
  button.btn-yellow:hover { background: var(--neon-yellow); color: var(--bg-dark); box-shadow: 0 0 10px var(--neon-yellow); }

  button.btn-green { border-color: var(--neon-green); color: var(--neon-green); }
  button.btn-green:hover { background: var(--neon-green); color: var(--bg-dark); box-shadow: 0 0 10px var(--neon-green); }

  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:disabled:hover { background: transparent; color: inherit; box-shadow: none; }

  .editor-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 14px;
    overflow: hidden;
    gap: 10px;
    min-width: 0;
  }

  .search-widget {
    background: linear-gradient(90deg, rgba(252, 238, 10, 0.12) 0%, rgba(13, 14, 23, 0.8) 100%);
    border: 1px solid var(--neon-yellow);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 0 15px rgba(252, 238, 10, 0.15);
    border-radius: var(--radius);
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .search-widget label {
    margin: 0;
    color: var(--neon-yellow);
    white-space: nowrap;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .search-widget input {
    margin: 0;
    flex: 1;
    min-width: 160px;
    border-color: var(--neon-yellow);
    background: rgba(0, 0, 0, 0.6);
  }

  .search-widget button {
    border-color: var(--neon-yellow);
    color: var(--neon-yellow);
    margin: 0;
    padding: 6px 9px;
  }
  .search-widget button:hover:not(:disabled) { background: var(--neon-yellow); color: var(--bg-dark); }

  .search-nav-btn {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--neon-cyan) !important;
    color: var(--neon-cyan) !important;
    width: 30px;
    height: 30px;
    padding: 0 !important;
    font-size: 0.7rem;
  }
  .search-nav-btn:hover:not(:disabled) {
    background: var(--neon-cyan) !important;
    color: var(--bg-dark) !important;
  }

  .search-highlight-toggle {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--neon-magenta) !important;
    color: var(--neon-magenta) !important;
    width: 30px;
    height: 30px;
    padding: 0 !important;
    font-size: 0.7rem;
  }
  .search-highlight-toggle.active {
    background: var(--neon-magenta) !important;
    color: #fff !important;
  }
  .search-highlight-toggle:hover:not(:disabled) { background: var(--neon-magenta) !important; color: #fff !important; }

  .search-counter {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.78rem;
    color: var(--neon-green);
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 255, 102, 0.4);
    padding: 4px 10px;
    border-radius: var(--radius);
    min-width: 58px;
    text-align: center;
    letter-spacing: 1px;
  }

  .search-info {
    font-size: 0.78rem;
    color: var(--text-dim);
    white-space: nowrap;
    min-width: 110px;
    text-align: right;
  }

  .editor-info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.6);
    border-left: 3px solid var(--neon-cyan);
    border-right: 1px solid rgba(0, 243, 255, 0.2);
    flex-shrink: 0;
  }

  .editor-container {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  #editor {
    flex: 1;
    background: rgba(5, 5, 8, 0.85);
    border: 1px solid rgba(0, 243, 255, 0.3);
    padding: 24px;
    color: var(--text-main);
    font-size: 16px;
    line-height: 1.7;
    overflow-y: auto;
    outline: none;
    position: relative;
    scroll-behavior: smooth;
    word-wrap: break-word;
  }

  #editor:focus {
    border-color: var(--neon-cyan);
    box-shadow: inset 0 0 25px rgba(0, 243, 255, 0.08);
  }

  #editor * { max-width: 100%; }

  #rawHtmlViewer {
    display: none;
    flex: 1;
    background: #020204;
    border: 1px solid var(--neon-magenta);
    padding: 20px;
    color: var(--neon-cyan);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    resize: none;
    white-space: pre-wrap;
    overflow-y: auto;
  }

  #editor .search-highlight {
    background: rgba(252, 238, 10, 0.25) !important;
    color: var(--neon-yellow) !important;
    border-bottom: 2px solid var(--neon-yellow);
    padding: 0 2px;
    border-radius: 2px;
    text-shadow: 0 0 5px var(--neon-yellow);
  }

  #editor .search-highlight.active-match {
    background: var(--neon-magenta) !important;
    color: #ffffff !important;
    border-bottom: 2px solid #ffffff;
    text-shadow: 0 0 10px #ffffff;
    box-shadow: 0 0 15px var(--neon-magenta);
  }

  /* BARRA DE FORMATAÇÃO */
  .format-toolbar {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    background: linear-gradient(90deg, rgba(0, 243, 255, 0.08) 0%, var(--bg-panel) 100%);
    border: 1px solid var(--neon-cyan);
    flex-wrap: wrap;
    align-items: flex-end;
    border-radius: var(--radius);
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(0, 243, 255, 0.12);
  }

  .format-toolbar > div {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .format-toolbar label {
    font-size: 0.68rem;
    color: var(--neon-cyan);
    margin-bottom: 0;
  }

  .format-toolbar select,
  .format-toolbar input[type="color"] {
    width: auto;
    min-width: 80px;
    margin-bottom: 0;
    padding: 6px 8px;
    font-size: 0.8rem;
  }

  .format-toolbar input[type="color"] {
    height: 34px;
    padding: 2px;
    cursor: pointer;
    background: var(--bg-input);
  }

  .format-buttons {
    display: flex !important;
    flex-direction: row !important;
    gap: 4px !important;
    align-items: flex-end;
  }

  .fmt-btn {
    width: 36px;
    height: 36px;
    padding: 0 !important;
    font-size: 0.9rem;
    border-color: var(--neon-cyan) !important;
    color: var(--neon-cyan) !important;
  }
  .fmt-btn:hover { background: var(--neon-cyan) !important; color: var(--bg-dark) !important; }
  .fmt-btn.active {
    background: var(--neon-cyan) !important;
    color: var(--bg-dark) !important;
    box-shadow: var(--border-glow);
  }

  .btn-apply-fmt {
    border-color: var(--neon-green) !important;
    color: var(--neon-green) !important;
    padding: 8px 16px !important;
    font-weight: bold;
    letter-spacing: 1px;
    height: 36px;
  }
  .btn-apply-fmt:hover { background: var(--neon-green) !important; color: var(--bg-dark) !important; }

  .btn-clear-fmt {
    border-color: var(--neon-magenta) !important;
    color: var(--neon-magenta) !important;
    padding: 8px 16px !important;
    font-weight: bold;
    letter-spacing: 1px;
    height: 36px;
  }
  .btn-clear-fmt:hover { background: var(--neon-magenta) !important; color: #fff !important; }

  .btn-nav-top,
  .btn-nav-bottom {
    padding: 8px 12px;
    min-width: 44px;
    font-size: 0.9rem;
    height: 36px;
    border-color: var(--neon-cyan) !important;
    color: var(--neon-cyan) !important;
  }
  .btn-nav-top:hover, .btn-nav-bottom:hover {
    background: var(--neon-cyan) !important;
    color: var(--bg-dark) !important;
  }

  .format-hint {
    font-size: 0.7rem;
    color: var(--neon-yellow);
    background: rgba(252, 238, 10, 0.1);
    border: 1px solid rgba(252, 238, 10, 0.4);
    padding: 4px 8px;
    border-radius: var(--radius);
    align-self: center;
    margin-left: auto;
    white-space: nowrap;
  }

  .toast-bar {
    padding: 8px 12px;
    font-size: 0.8rem;
    border-radius: var(--radius);
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    word-break: break-word;
  }
  .toast-info { background: rgba(0, 243, 255, 0.15); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }
  .toast-success { background: rgba(0, 255, 102, 0.15); border: 1px solid var(--neon-green); color: var(--neon-green); }
  .toast-error { background: rgba(255, 0, 85, 0.15); border: 1px solid var(--neon-magenta); color: var(--neon-magenta); }

  .debug-box {
    margin-top: 10px;
    background: #020204;
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    padding: 8px 10px;
    border: 1px solid rgba(0, 255, 102, 0.3);
    border-radius: var(--radius);
    max-height: 140px;
    overflow-y: auto;
    line-height: 1.45;
    display: none;
  }

  @media (max-width: 850px) {
    html, body { height: auto; min-height: 100vh; overflow-y: auto; overflow-x: hidden; }
    .main-container { flex-direction: column; overflow: visible; flex: none; }
    .sidebar { width: 100%; max-height: none; overflow: visible; border-right: none; border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding: 12px; gap: 12px; flex-shrink: 0; }
    .editor-wrapper { padding: 12px; overflow: visible; flex: none; }
    .editor-container { height: 70vh; min-height: 420px; flex: none; }
    #editor { height: 100%; padding: 16px; font-size: 15px; }
    header { padding: 10px 14px; }
    header h1 { font-size: 1rem; letter-spacing: 1px; }
    .status-indicator { font-size: 0.68rem; padding: 4px 10px; }
    .search-widget { padding: 8px 10px; gap: 6px; }
    .search-widget label { font-size: 0.7rem; }
    .search-widget input { font-size: 0.85rem; min-width: 100%; order: 2; }
    .search-counter { order: 3; }
    .search-nav-btn, .search-highlight-toggle, .search-widget .btn-magenta { order: 4; }
    .search-info { order: 5; text-align: left; min-width: 0; width: 100%; }
    .format-toolbar { gap: 6px; padding: 8px; }
    .format-toolbar > div { flex: 1 1 calc(50% - 6px); min-width: 100px; }
    .format-toolbar select, .format-toolbar input[type="color"] { width: 100%; min-width: 0; }
    .format-hint { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1><i class="fa-solid fa-terminal"></i> GRAPHZO EDITOR <span style="color: var(--neon-magenta);">v3.3</span></h1>
  <div class="status-indicator">
    <div class="pulse" id="statusPulse"></div>
    <span id="statusText">NEURAL LINK ACTIVE</span>
  </div>
</header>

<div class="main-container">
  <aside class="sidebar">
    <div class="panel">
      <div class="panel-title"><i class="fa-brands fa-github"></i> // CONEXÃO GITHUB</div>
      <label><i class="fa-solid fa-key"></i> Token Number</label>
      <input type="password" id="ghToken" placeholder="Cole o token do GitHub..." onchange="persistConfig()">
      <label><i class="fa-solid fa-box-archive"></i> Repositório</label>
      <input type="text" id="ghRepo" placeholder="usuario/repositorio" value="andreyoldekamp-del/GraphZoBackup" onchange="persistConfig()">
      <label><i class="fa-solid fa-folder"></i> Pasta</label>
      <input type="text" id="ghFolder" placeholder="historias" value="historias" onchange="persistConfig()">
      <label><i class="fa-solid fa-list-check"></i> Selecionar da Pasta</label>
      <select id="ghFileSelect" onchange="onSelectFileChange()">
        <option value="">-- Clique em Listar --</option>
      </select>
      <div class="btn-group">
        <button onclick="listFiles()"><i class="fa-solid fa-rotate"></i> Listar</button>
        <button onclick="loadFile()" class="btn-magenta"><i class="fa-solid fa-cloud-arrow-down"></i> Carregar</button>
        <button onclick="saveFile()" class="btn-yellow" id="btnSaveGh"><i class="fa-solid fa-cloud-arrow-up"></i> Salvar no GitHub</button>
        <button onclick="deleteFile()" class="btn-magenta"><i class="fa-solid fa-trash-can"></i> Deletar</button>
      </div>
      <div id="toastGh" class="toast-bar"></div>
    </div>

    <div class="panel">
      <div class="panel-title"><i class="fa-solid fa-microchip"></i> // CONTROLES LOCAIS</div>
      <input type="file" id="localFileInput" style="display:none;" accept=".html,.xhtml,.txt,.md" onchange="handleLocalFile(event)">
      <div class="btn-group">
        <button onclick="document.getElementById('localFileInput').click()"><i class="fa-solid fa-folder-open"></i> Abrir PC</button>
        <button onclick="downloadPC()"><i class="fa-solid fa-download"></i> Baixar PC</button>
        <button onclick="toggleRawCode()"><i class="fa-solid fa-code"></i> HTML Bruto</button>
        <button onclick="clearEditor()" class="btn-magenta"><i class="fa-solid fa-trash"></i> Limpar Editor</button>
      </div>
      <div style="margin-top: 14px; font-size: 0.73rem; color: var(--text-dim); border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px;">
        <strong style="color: var(--neon-cyan);">METADADOS:</strong><br>
        Nome: <span id="infoName" style="color:#fff;">-</span><br>
        SHA: <span id="infoSHA" style="color:var(--neon-yellow);">Não gravado</span>
      </div>
      <div id="debugConsole" class="debug-box"></div>
    </div>
  </aside>

  <main class="editor-wrapper">
    <div class="editor-info-bar">
      <span>LIVRO ATIVO: <strong id="currentFileName" style="color: var(--neon-cyan);">nenhum_livro_aberto.html</strong></span>
      <span id="editorStatusText" style="color: var(--neon-yellow);">PRONTO</span>
    </div>

    <div class="editor-container">
      <div id="editor" contenteditable="true" spellcheck="false"></div>
      <textarea id="rawHtmlViewer" placeholder="Código HTML/XHTML bruto..."></textarea>
    </div>

    <div class="format-toolbar">
      <div class="format-buttons">
        <button class="fmt-btn" id="fmtBold" title="Negrito"><i class="fa-solid fa-bold"></i></button>
        <button class="fmt-btn" id="fmtItalic" title="Itálico"><i class="fa-solid fa-italic"></i></button>
        <button class="fmt-btn" id="fmtUnderline" title="Sublinhado"><i class="fa-solid fa-underline"></i></button>
        <button class="fmt-btn" id="fmtStrike" title="Riscado"><i class="fa-solid fa-strikethrough"></i></button>
      </div>
      <div>
        <label>Fonte</label>
        <select id="fontFamily">
          <option value="'Share Tech Mono', monospace">Cyber Mono</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
        </select>
      </div>
      <div>
        <label>Tamanho</label>
        <select id="fontSize">
          <option value="14px">14 px</option>
          <option value="16px" selected>16 px</option>
          <option value="18px">18 px</option>
          <option value="24px">24 px</option>
        </select>
      </div>
      <div>
        <label>Cor</label>
        <input type="color" id="textColor" value="#e0e6ed">
      </div>
      <div class="format-buttons">
        <button class="btn-apply-fmt" id="btnApplyFormat"><i class="fa-solid fa-wand-magic-sparkles"></i> Aplicar</button>
        <button class="btn-clear-fmt" id="btnClearFormat"><i class="fa-solid fa-eraser"></i> Limpar</button>
      </div>
    </div>
  </main>
</div>

<script>
const state = { sha: '', path: '', fileName: '', isRawView: false };
const STORAGE_KEYS = { TOKEN: 'graphzo_cyber_token', REPO: 'graphzo_cyber_repo', FOLDER: 'graphzo_cyber_folder' };

window.addEventListener('load', () => {
  loadPersistedConfig();
  setupEditorListeners();
  showToast('Sistemas operacionais ativados.', 'success');
});

function log(msg, type = 'info') {
  const box = document.getElementById('debugConsole');
  box.style.display = 'block';
  const line = document.createElement('div');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  line.style.color = type === 'error' ? 'var(--neon-magenta)' : type === 'ok' ? 'var(--neon-green)' : 'var(--neon-cyan)';
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function showToast(msg, type = 'info') {
  const el = document.getElementById('toastGh');
  el.className = `toast-bar toast-${type}`;
  el.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${msg}`;
  el.style.display = 'flex';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

function persistConfig() {
  localStorage.setItem(STORAGE_KEYS.TOKEN, document.getElementById('ghToken').value.trim());
  localStorage.setItem(STORAGE_KEYS.REPO, document.getElementById('ghRepo').value.trim());
  localStorage.setItem(STORAGE_KEYS.FOLDER, document.getElementById('ghFolder').value.trim());
}

function loadPersistedConfig() {
  if (localStorage.getItem(STORAGE_KEYS.TOKEN)) document.getElementById('ghToken').value = localStorage.getItem(STORAGE_KEYS.TOKEN);
  if (localStorage.getItem(STORAGE_KEYS.REPO)) document.getElementById('ghRepo').value = localStorage.getItem(STORAGE_KEYS.REPO);
  if (localStorage.getItem(STORAGE_KEYS.FOLDER)) document.getElementById('ghFolder').value = localStorage.getItem(STORAGE_KEYS.FOLDER);
}

function setupEditorListeners() {
  document.getElementById('btnApplyFormat').onclick = () => {
    const font = document.getElementById('fontFamily').value;
    const size = document.getElementById('fontSize').value;
    const color = document.getElementById('textColor').value;
    const selection = window.getSelection();
    if (!selection.rangeCount || selection.isCollapsed) return showToast('Selecione um texto primeiro!', 'error');
    const span = document.createElement('span');
    span.style.fontFamily = font;
    span.style.fontSize = size;
    span.style.color = color;
    span.appendChild(selection.getRangeAt(0).extractContents());
    selection.getRangeAt(0).insertNode(span);
    showToast('Formatação aplicada com sucesso!', 'success');
  };

  document.getElementById('btnClearFormat').onclick = () => {
    const selection = window.getSelection();
    if (!selection.rangeCount || selection.isCollapsed) return showToast('Selecione um texto primeiro!', 'error');
    document.execCommand('removeFormat', false, null);
    showToast('Formatação limpa.', 'info');
  };
}

function clearEditor() {
  if (confirm('Tem certeza que deseja limpar todo o conteúdo do editor?')) {
    document.getElementById('editor').innerHTML = '';
    state.sha = '';
    state.path = '';
    state.fileName = '';
    document.getElementById('infoSHA').textContent = 'Não gravado';
    updateFileLabels();
    showToast('Editor limpo.', 'info');
  }
}

function updateFileLabels() {
  document.getElementById('currentFileName').textContent = state.fileName || 'nenhum_livro_aberto.html';
  document.getElementById('infoName').textContent = state.fileName || '-';
}

function toggleRawCode() {
  const ed = document.getElementById('editor');
  const raw = document.getElementById('rawHtmlViewer');
  state.isRawView = !state.isRawView;
  if (state.isRawView) {
    raw.value = ed.innerHTML;
    ed.style.display = 'none';
    raw.style.display = 'block';
  } else {
    ed.innerHTML = raw.value;
    raw.style.display = 'none';
    ed.style.display = 'block';
  }
}

async function listFiles() {
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const folder = document.getElementById('ghFolder').value.trim();
  if (!token || !repo) return showToast('Preencha o Token e o Repositório!', 'error');
  
  showToast('Buscando lista de arquivos...', 'info');
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${folder}`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) throw new Error(`Erro HTTP ${res.status}`);
    const data = await res.json();
    const select = document.getElementById('ghFileSelect');
    select.innerHTML = '<option value="">-- Selecione um livro --</option>';
    data.forEach(file => {
      if (file.type === 'file') {
        const opt = document.createElement('option');
        opt.value = file.path;
        opt.textContent = file.name;
        select.appendChild(opt);
      }
    });
    showToast('Arquivos listados com sucesso!', 'success');
  } catch (e) {
    log(`Erro ao listar: ${e.message}`, 'error');
    showToast(`Erro ao listar: ${e.message}`, 'error');
  }
}

function onSelectFileChange() {
  const sel = document.getElementById('ghFileSelect');
  if (sel.value) {
    const parts = sel.value.split('/');
    state.fileName = parts[parts.length - 1];
    state.path = sel.value;
    updateFileLabels();
  }
}

async function loadFile() {
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  if (!state.path) return showToast('Selecione um arquivo na lista primeiro!', 'error');
  
  showToast('Carregando arquivo do GitHub...', 'info');
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${state.path}`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) throw new Error(`Erro HTTP ${res.status}`);
    const data = await res.json();
    state.sha = data.sha;
    document.getElementById('infoSHA').textContent = state.sha.substring(0, 7) + '...';
    
    const binary = atob(data.content.replace(/\s/g, ''));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const decodedText = new TextDecoder('utf-8').decode(bytes);
    
    document.getElementById('editor').innerHTML = decodedText;
    showToast('Livro carregado com sucesso!', 'success');
  } catch (e) {
    log(`Erro ao carregar: ${e.message}`, 'error');
    showToast(`Erro ao carregar: ${e.message}`, 'error');
  }
}

async function saveFile() {
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  if (!token || !repo) return showToast('Preencha o Token e o Repositório!', 'error');
  if (!state.path) {
    const name = prompt('Digite o nome do arquivo para salvar (ex: meu_livro.html):');
    if (!name) return;
    const folder = document.getElementById('ghFolder').value.trim();
    state.fileName = name;
    state.path = folder ? `${folder}/${name}` : name;
  }

  showToast('Salvando no GitHub...', 'info');
  try {
    const contentHtml = state.isRawView ? document.getElementById('rawHtmlViewer').value : document.getElementById('editor').innerHTML;
    const base64Content = btoa(unescape(encodeURIComponent(contentHtml)));

    const bodyData = {
      message: `Atualização via GraphZo Editor - ${new Date().toLocaleString()}`,
      content: base64Content,
      branch: 'main'
    };
    if (state.sha) bodyData.sha = state.sha;

    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${state.path}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(bodyData)
    });

    if (!res.ok) {
      const errJson = await res.json();
      throw new Error(errJson.message || `Erro HTTP ${res.status}`);
    }

    const resData = await res.json();
    state.sha = resData.content.sha;
    document.getElementById('infoSHA').textContent = state.sha.substring(0, 7) + '...';
    updateFileLabels();
    showToast('Salvo no GitHub com sucesso!', 'success');
  } catch (e) {
    log(`Erro ao salvar: ${e.message}`, 'error');
    showToast(`Erro ao salvar: ${e.message}`, 'error');
  }
}

function downloadPC() {
  const content = state.isRawView ? document.getElementById('rawHtmlViewer').value : document.getElementById('editor').innerHTML;
  const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = state.fileName || 'livro_graphzo.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Arquivo baixado para o PC.', 'success');
}

function handleLocalFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  state.fileName = file.name;
  state.path = '';
  state.sha = '';
  updateFileLabels();
  
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('editor').innerHTML = e.target.result;
    showToast('Arquivo local carregado.', 'success');
  };
  reader.readAsText(file);
}
</script>
