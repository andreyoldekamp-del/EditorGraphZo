<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Editor de Livros</title>
<style>
:root {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-tertiary: #0f3460;
  --text-primary: #eaeaea;
  --text-secondary: #a0a0a0;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --gold: #ffd700;
  --rose: #ffb3c6;
  --mint: #a8e6cf;
  --lavender: #c8b6ff;
  --border: #2a2a4e;
  --scroll-thumb: #4a4a6e;
  --scroll-track: #1a1a2e;
  --button-bg: #2a2a4e;
  --button-hover: #3a3a5e;
  --button-pressed: #1a1a2e;
  --save-bg: #2ecc71;
  --save-hover: #27ae60;
  --shadow: rgba(0,0,0,0.3);

  --z-menubar: auto;
  --z-context: 2000;
  --z-popup: 1500;
  --z-overlay: 9998;
  --z-dropdown: 9999;
  --z-modal: 10050;
  --z-loading: 10080;
  --z-toast: 10100;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--scroll-track); }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

#menuBar {
  display: flex;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border);
  padding: 4px 8px;
  gap: 4px;
  flex-wrap: wrap;
  position: relative;
  z-index: var(--z-menubar);
}

.menu-group { position: relative; }

.menu-btn {
  background: var(--button-bg);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 6px 12px;
  cursor: pointer;
  border-radius: 4px;
  font-size: 13px;
  transition: all 0.2s;
  -webkit-tap-highlight-color: rgba(233, 69, 96, 0.3);
  touch-action: manipulation;
  user-select: none;
}

.menu-btn:hover, .menu-btn:active {
  background: var(--button-hover);
  border-color: var(--accent);
}

.menu-dropdown {
  display: none;
  position: fixed;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  min-width: 220px;
  max-width: calc(100vw - 20px);
  z-index: var(--z-dropdown);
  box-shadow: 0 4px 12px var(--shadow);
  max-height: 70vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.menu-dropdown.active { display: block; }

.menu-item {
  padding: 12px 16px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.15s;
  -webkit-tap-highlight-color: rgba(233, 69, 96, 0.2);
  touch-action: manipulation;
  user-select: none;
}

.menu-item:hover, .menu-item:active {
  background: var(--button-hover);
  color: var(--accent-hover);
}

.menu-item .shortcut {
  color: var(--text-secondary);
  font-size: 11px;
  margin-left: 20px;
}

.menu-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

.mobile-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: var(--z-overlay);
  animation: fadeIn 0.2s;
}

.mobile-overlay.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

#tabsBar {
  display: flex;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  white-space: nowrap;
}

.tab {
  padding: 8px 16px;
  cursor: pointer;
  border-right: 1px solid var(--border);
  font-size: 13px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  -webkit-tap-highlight-color: rgba(233, 69, 96, 0.2);
  touch-action: manipulation;
}

.tab:hover { background: var(--button-hover); }

.tab.active {
  background: var(--bg-tertiary);
  color: var(--accent-hover);
  border-bottom: 2px solid var(--accent);
}

#mainContent {
  display: flex;
  flex: 1;
  height: calc(100vh - 90px);
  position: relative;
}

.tab-content {
  display: none;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.tab-content.active { display: flex; }

#editorContainer {
  display: flex;
  flex-direction: column;
  flex: 1;
  height: 100%;
}

#editorToolbar {
  display: flex;
  gap: 4px;
  padding: 6px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: center;
}

.tool-btn {
  background: var(--button-bg);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 4px 10px;
  cursor: pointer;
  border-radius: 3px;
  font-size: 13px;
  min-width: 32px;
  transition: all 0.15s;
  -webkit-tap-highlight-color: rgba(233, 69, 96, 0.2);
  touch-action: manipulation;
}

.tool-btn:hover {
  background: var(--button-hover);
  border-color: var(--accent);
}

.tool-btn:active { background: var(--button-pressed); }

.tool-select {
  background: var(--button-bg);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 3px;
  font-size: 13px;
  cursor: pointer;
}

.tool-color {
  width: 32px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  background: transparent;
}

#editor {
  flex: 1;
  padding: 30px;
  overflow-y: auto;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Times New Roman', serif;
  font-size: 14pt;
  line-height: 1.5;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
  min-height: 100%;
}

#editor[contenteditable]:empty:before {
  content: attr(data-placeholder);
  color: var(--text-secondary);
  font-style: italic;
}

#editor img {
  max-width: 100%;
  height: auto;
  margin: 10px 0;
  display: block;
}

#pageInfo {
  position: absolute;
  top: 8px;
  right: 16px;
  background: var(--bg-tertiary);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  z-index: 10;
  pointer-events: none;
}

#bottomBar {
  display: flex;
  gap: 6px;
  padding: 6px;
  background: var(--bg-tertiary);
  border-top: 1px solid var(--border);
  align-items: center;
  flex-wrap: wrap;
}

.bottom-btn {
  background: var(--button-bg);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 4px 10px;
  cursor: pointer;
  border-radius: 3px;
  font-size: 14px;
  transition: all 0.15s;
  -webkit-tap-highlight-color: rgba(233, 69, 96, 0.2);
  touch-action: manipulation;
}

.bottom-btn:hover {
  background: var(--button-hover);
  border-color: var(--accent);
}

.bottom-btn.recording {
  background: #c0392b;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.bottom-input {
  background: var(--bg-primary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 3px;
  font-size: 12px;
  width: 140px;
}

.bottom-checkbox {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  cursor: pointer;
}

#charactersPanel, #chaptersPanel {
  display: flex;
  width: 100%;
  height: 100%;
}

#charactersList, #chaptersList {
  width: 250px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 8px;
}

.character-item, .chapter-item {
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 4px;
  margin-bottom: 4px;
  font-size: 13px;
  transition: all 0.15s;
  touch-action: manipulation;
}

.character-item:hover, .chapter-item:hover { background: var(--button-hover); }

.character-item.active, .chapter-item.active {
  background: var(--bg-tertiary);
  border-left: 3px solid var(--accent);
}

.character-delete {
  background: transparent;
  color: var(--text-secondary);
  border: none;
  cursor: pointer;
  font-size: 14px;
  padding: 2px 6px;
  border-radius: 3px;
}

.character-delete:hover {
  background: #c0392b;
  color: white;
}

#characterEditor {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 12px;
  overflow: hidden;
}

#characterEditorToolbar {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  align-items: center;
  flex-wrap: wrap;
}

#characterImageCarousel {
  width: 200px;
  height: 200px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  margin-bottom: 8px;
  flex-shrink: 0;
}

#characterImageCarousel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#characterImageCarousel .empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-secondary);
  font-size: 12px;
}

#characterEditArea, .futuro-editor {
  flex: 1;
  padding: 16px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow-y: auto;
  outline: none;
  font-family: 'Times New Roman', serif;
  font-size: 13pt;
  line-height: 1.5;
  color: var(--text-primary);
  user-select: text;
  -webkit-user-select: text;
}

.futuro-container, .temporaria-container, #timelinePanel, #dictionaryPanel {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding: 12px;
  gap: 8px;
}

.futuro-label {
  background: var(--bg-tertiary);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 14px;
  border-left: 3px solid var(--accent);
}

.futuro-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.save-btn {
  background: var(--save-bg);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
  touch-action: manipulation;
}

.save-btn:hover { background: var(--save-hover); }

#chaptersStats {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
}

.stat-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 12px;
}

.stat-card h3 {
  color: var(--accent-hover);
  margin-bottom: 8px;
  font-size: 14px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}

.stat-value { color: var(--gold); font-weight: bold; }

#timelineGrid {
  flex: 1;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: auto;
  position: relative;
  padding: 16px;
}

.timeline-event {
  position: absolute;
  padding: 8px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  border: 1px solid var(--border);
  min-width: 120px;
  max-width: 200px;
  box-shadow: 0 2px 4px var(--shadow);
}

#dictionaryTable {
  flex: 1;
  overflow: auto;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
}

#dictionaryTable table { width: 100%; border-collapse: collapse; }
#dictionaryTable th { background: var(--bg-tertiary); padding: 8px; text-align: left; position: sticky; top: 0; font-size: 13px; }
#dictionaryTable td { padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }

#contextMenu, .floating-popup {
  display: none;
  position: fixed;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  z-index: var(--z-popup);
  box-shadow: 0 4px 12px var(--shadow);
}

#contextMenu.active, .floating-popup.active { display: block; }

.context-item {
  padding: 10px 16px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.context-item:hover { background: var(--button-hover); color: var(--accent-hover); }

.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: var(--z-modal);
  justify-content: center;
  align-items: center;
  padding: 10px;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 100%;
  max-width: 600px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 8px 24px var(--shadow);
}

.modal-header {
  background: var(--bg-tertiary);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
}

.modal-body { padding: 16px; }
.modal-footer { padding: 12px 16px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--text-secondary); }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px; background: var(--bg-primary); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 4px; font-size: 16px;
}

#toast {
  position: fixed; bottom: 80px; right: 20px; background: var(--bg-tertiary); color: var(--text-primary);
  padding: 12px 20px; border-radius: 6px; border-left: 4px solid var(--accent); z-index: var(--z-toast);
  opacity: 0; transform: translateY(20px); transition: all 0.3s; pointer-events: none;
}
#toast.show { opacity: 1; transform: translateY(0); }

#bootBar {
  display: none; background: var(--bg-tertiary); padding: 8px 16px; border-bottom: 1px solid var(--border); align-items: center; gap: 12px;
}
#bootBar.active { display: flex; }

@media (max-width: 768px) {
  #menuBar { flex-direction: column; padding: 8px; gap: 6px; }
  .menu-btn { width: 100%; text-align: left; min-height: 44px; display: flex; justify-content: space-between; align-items: center; }
  .menu-dropdown { position: static; width: 100%; max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.3s ease-out; }
  .menu-dropdown.active { max-height: 500px; opacity: 1; }
  #charactersPanel, #chaptersPanel { flex-direction: column; }
  #charactersList, #chaptersList { width: 100%; max-height: 250px; }
  #mainContent { height: auto; min-height: 60vh; }
}
</style>
</head>
<body>
<div class="mobile-overlay" id="mobileOverlay" onclick="closeAllMenus()"></div>
<div id="bootBar"><span id="bootMessage">Inicializando...</span></div>
<div id="menuBar">
<div class="menu-group">
<button class="menu-btn" data-menu="arquivo">📁 Arquivo</button>
<div class="menu-dropdown" id="menu-arquivo">
<div class="menu-item" data-action="newStory">📄 Nova História</div>
<div class="menu-item" data-action="openStory">📂 Abrir História</div>
<div class="menu-item" data-action="saveStory">💾 Salvar</div>
</div>
</div>
<div class="menu-group">
<button class="menu-btn" data-menu="github">☁️ GitHub</button>
<div class="menu-dropdown" id="menu-github">
<div class="menu-item" onclick="configureGithub()">⚙️ Configurar</div>
<div class="menu-item" onclick="listGithubFiles()">📂 Listar Arquivos</div>
<div class="menu-item" onclick="pushToGithub()">📤 Push</div>
<div class="menu-item" onclick="pullFromGithub()">📥 Pull</div>
</div>
</div>
</div>

<div id="tabsBar">
<div class="tab active" data-tab="editor" onclick="switchTab('editor')">📖 Editor</div>
<div class="tab" data-tab="characters" onclick="switchTab('characters')">👥 Personagens</div>
<div class="tab" data-tab="chapters" onclick="switchTab('chapters')">📑 Capítulos</div>
</div>

<div id="mainContent">
<div class="tab-content active" id="tab-editor">
<div id="editorContainer">
<div id="editorToolbar">
<button class="tool-btn" onclick="execCmd('bold')"><b>B</b></button>
<button class="tool-btn" onclick="execCmd('italic')"><i>I</i></button>
</div>
<div id="pageInfo">📄 1/1</div>
<div id="editor" contenteditable="true" data-placeholder="Escreva sua história aqui..."></div>
</div>
</div>
<div class="tab-content" id="tab-characters"><div id="charactersPanel"><div id="charactersList"><button class="tool-btn" onclick="createCharacter()">➕ Novo</button><div id="charactersListItems"></div></div><div id="characterEditor"><div id="characterEditArea" contenteditable="true"></div></div></div></div>
<div class="tab-content" id="tab-chapters"><div id="chaptersPanel"><div id="chaptersList"><div id="chaptersListItems"></div></div><div id="chaptersStats"></div></div></div>
</div>

<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<div class="modal-header"><span id="modalTitle">Título</span><button onclick="closeModal()">✕</button></div>
<div class="modal-body" id="modalBody"></div>
<div class="modal-footer" id="modalFooter"></div>
</div>
</div>
<div id="toast"></div>

<script>
const state = {
  currentStory: null,
  currentCharacter: null,
  stories: {},
  characters: {},
  github: { token: '', repo: 'andreyoldekamp-del/GraphZoBackup', branch: 'main', folder: 'historias' }
};

window.addEventListener('load', async () => {
  loadConfig();
  loadStories();
  await loadLastStory();
  initializeMenus();
  showToast('✅ Pronto!');
});

function initializeMenus() {
  document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const menuName = btn.dataset.menu;
      const dropdown = document.getElementById('menu-' + menuName);
      const isActive = dropdown.classList.contains('active');
      document.querySelectorAll('.menu-dropdown').forEach(d => d.classList.remove('active'));
      if (!isActive) dropdown.classList.add('active');
    };
  });
  document.querySelectorAll('.menu-item').forEach(item => {
    item.onclick = (e) => {
      e.stopPropagation();
      const action = item.dataset.action;
      if (action === 'newStory') newStory();
      else if (action === 'openStory') openStory();
      else if (action === 'saveStory') saveStory();
      document.querySelectorAll('.menu-dropdown').forEach(d => d.classList.remove('active'));
    };
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.menu-dropdown').forEach(d => d.classList.remove('active'));
  });
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');
}

function execCmd(cmd) { document.execCommand(cmd, false, null); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function loadConfig() {
  const cfg = localStorage.getItem('bookEditor_config');
  if (cfg) { const p = JSON.parse(cfg); if (p.github) state.github = { ...state.github, ...p.github }; }
}
function loadStories() {
  const s = localStorage.getItem('bookEditor_stories');
  if (s) state.stories = JSON.parse(s);
}
async function loadLastStory() {
  if (state.github.token && state.github.repo) await pullFromGithub(true);
  const cfg = JSON.parse(localStorage.getItem('bookEditor_config') || '{}');
  if (cfg.lastStory && state.stories[cfg.lastStory]) {
    state.currentStory = cfg.lastStory;
    document.getElementById('editor').innerHTML = state.stories[cfg.lastStory].content || '';
  }
}

function newStory() {
  showModal('Nova História', '<div class="form-group"><label>Nome:</label><input type="text" id="newStoryName"></div>', [
    { text: 'Criar', action: 'confirmNewStory()', primary: true }
  ]);
}
function confirmNewStory() {
  const name = document.getElementById('newStoryName').value.trim();
  if (!name) return showToast('⚠️ Nome obrigatório');
  state.stories[name] = { content: '', characters: {} };
  state.currentStory = name;
  document.getElementById('editor').innerHTML = '';
  localStorage.setItem('bookEditor_stories', JSON.stringify(state.stories));
  closeModal();
  showToast('📖 História criada');
}
function openStory() {
  const names = Object.keys(state.stories);
  if (names.length === 0) return showToast('⚠️ Nenhuma história salva');
  let html = '<div class="form-group"><select id="storySelect">';
  names.forEach(n => html += `<option value="${n}">${n}</option>`);
  html += '</select></div>';
  showModal('Abrir História', html, [{ text: 'Abrir', action: 'confirmOpenStory()', primary: true }]);
}
function confirmOpenStory() {
  const name = document.getElementById('storySelect').value;
  state.currentStory = name;
  document.getElementById('editor').innerHTML = state.stories[name].content || '';
  localStorage.setItem('bookEditor_config', JSON.stringify({ lastStory: name, github: state.github }));
  closeModal();
  showToast(`📖 ${name} aberta`);
}
function saveStory() {
  if (!state.currentStory) return newStory();
  state.stories[state.currentStory].content = document.getElementById('editor').innerHTML;
  localStorage.setItem('bookEditor_stories', JSON.stringify(state.stories));
  showToast('💾 Salvo localmente');
  if (state.github.token) pushToGithub(true);
}

function getGithubConfig() {
  return {
    token: document.getElementById('ghToken')?.value.trim() || state.github.token,
    repo: document.getElementById('ghRepo')?.value.trim() || state.github.repo,
    branch: document.getElementById('ghBranch')?.value.trim() || state.github.branch,
    folder: document.getElementById('ghFolder')?.value.trim() || state.github.folder
  };
}
function configureGithub() {
  const cfg = state.github;
  showModal('Configurar GitHub', `
    <div class="form-group"><label>Token (ghp_):</label><input type="password" id="ghToken" value="${cfg.token}"></div>
    <div class="form-group"><label>Repositório:</label><input type="text" id="ghRepo" value="${cfg.repo}"></div>
    <div class="form-group"><label>Branch:</label><input type="text" id="ghBranch" value="${cfg.branch}"></div>
    <div class="form-group"><label>Pasta:</label><input type="text" id="ghFolder" value="${cfg.folder}"></div>
  `, [{ text: 'Salvar', action: 'confirmConfigureGithub()', primary: true }]);
}
function confirmConfigureGithub() {
  state.github = getGithubConfig();
  localStorage.setItem('bookEditor_config', JSON.stringify({ lastStory: state.currentStory, github: state.github }));
  closeModal();
  showToast('✅ GitHub configurado');
}

async function ghRequest(path, options = {}) {
  const cfg = state.github;
  const url = `https://api.github.com/repos/${cfg.repo}/${path}`;
  const res = await fetch(url, {
    ...options,
    headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github+json', ...(options.headers || {}) }
  });
  if (!res.ok) throw new Error(`Erro GitHub: ${res.status}`);
  return res.status === 204 ? null : res.json();
}

async function pushToGithub(silent = false) {
  if (!state.github.token || !state.currentStory) return;
  try {
    const cfg = state.github;
    const content = state.stories[state.currentStory].content || '';
    const path = `${cfg.folder}/${state.currentStory}.xhtml`;
    let sha = null;
    try { const ex = await ghRequest(`contents/${encodeURIComponent(path)}?ref=${cfg.branch}`); sha = ex.sha; } catch(e){}
    const payload = { message: `Sync ${state.currentStory}`, content: btoa(unescape(encodeURIComponent(content))), branch: cfg.branch };
    if (sha) payload.sha = sha;
    await ghRequest(`contents/${encodeURIComponent(path)}`, { method: 'PUT', body: JSON.stringify(payload) });
    if (!silent) showToast('📤 Enviado ao GitHub!');
  } catch(e) { if (!silent) showToast('❌ Erro no Push: ' + e.message); }
}

async function pullFromGithub(silent = false) {
  if (!state.github.token) return;
  try {
    const cfg = state.github;
    const files = await ghRequest(`contents/${encodeURIComponent(cfg.folder)}?ref=${cfg.branch}`);
    for (const f of files.filter(x => x.name.endsWith('.xhtml'))) {
      const res = await fetch(f.download_url);
      const text = await res.text();
      const name = decodeURIComponent(f.name.replace('.xhtml', ''));
      state.stories[name] = { content: text };
    }
    localStorage.setItem('bookEditor_stories', JSON.stringify(state.stories));
    if (!silent) showToast('📥 Sincronizado!');
  } catch(e) { if (!silent) showToast('❌ Erro no Pull'); }
}

async function listGithubFiles() {
  if (!state.github.token) return configureGithub();
  try {
    const cfg = state.github;
    const files = await ghRequest(`contents/${encodeURIComponent(cfg.folder)}?ref=${cfg.branch}`);
    let html = '<ul>';
    files.forEach(f => html += `<li>📖 ${f.name}</li>`);
    html += '</ul>';
    showModal('Arquivos no GitHub', html, [{ text: 'Fechar', action: 'closeModal()' }]);
  } catch(e) { showToast('❌ Erro ao listar'); }
}

function showModal(title, body, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  const f = document.getElementById('modalFooter');
  f.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = b.primary ? 'save-btn' : 'tool-btn';
    btn.textContent = b.text;
    btn.onclick = () => eval(b.action);
    f.appendChild(btn);
  });
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
</script>
</body>
</html>
