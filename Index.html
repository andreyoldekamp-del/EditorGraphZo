<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphZo Editor v1.3 // CYBERPUNK</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Inter:wght@400;600&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-dark: #050508;
    --bg-panel: #0d0e17;
    --bg-input: #121320;
    --neon-cyan: #00f3ff;
    --neon-magenta: #ff0055;
    --neon-yellow: #fcee0a;
    --neon-green: #00ff66;
    --text-main: #e0e6ed;
    --text-dim: #7a8291;
    --border-glow: 0 0 8px rgba(0, 243, 255, 0.4);
    --border-magenta: 0 0 8px rgba(255, 0, 85, 0.4);
    --radius: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.03) 0%, transparent 80%),
      linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 24px 24px, 24px 24px;
  }

  header {
    background: linear-gradient(90deg, var(--bg-panel) 0%, rgba(255, 0, 85, 0.15) 100%);
    border-bottom: 2px solid var(--neon-magenta);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(255, 0, 85, 0.25);
    z-index: 10;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--neon-cyan);
    text-shadow: 0 0 12px var(--neon-cyan);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--neon-yellow);
    background: rgba(0, 0, 0, 0.4);
    padding: 6px 14px;
    border: 1px solid rgba(252, 238, 10, 0.3);
    border-radius: var(--radius);
  }

  .pulse {
    width: 10px;
    height: 10px;
    background: var(--neon-green);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--neon-green);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.25); }
    100% { opacity: 1; transform: scale(1); }
  }

  .main-container { 
    display: flex; 
    flex-direction: column;
    flex: 1; 
    overflow: hidden; 
  }

  .editor-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 14px;
    overflow: hidden;
    gap: 10px;
    min-width: 0;
    min-height: 0;
  }

  /* --- PAINEL DE CONFIGURAÇÕES COLAPSÁVEL (AGORA CENTRAL) --- */
  .config-panel {
    background: var(--bg-panel);
    border: 1px solid var(--neon-cyan);
    border-radius: var(--radius);
    overflow: hidden;
    display: none; /* Fechado por padrão para liberar 100% do espaço */
    flex-shrink: 0;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    max-height: 60vh; /* Limita altura para não empurrar o editor */
    display: flex;
    flex-direction: column;
  }
  .config-panel.open {
    display: flex;
    animation: slideDown 0.3s ease-out;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .config-header {
    background: rgba(0, 243, 255, 0.1);
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--neon-cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    border-bottom: 1px solid rgba(0, 243, 255, 0.3);
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .config-header:hover {
    background: rgba(0, 243, 255, 0.2);
  }
  .config-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto; /* Rolagem interna para não quebrar o layout */
  }

  .config-section {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 243, 255, 0.3);
    padding: 14px;
    position: relative;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  }

  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    color: var(--neon-magenta);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px dashed rgba(255, 0, 85, 0.5);
    padding-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-config-toggle {
    background: transparent;
    border: 1px solid var(--neon-yellow);
    color: var(--neon-yellow);
    padding: 4px 10px;
    font-size: 0.75rem;
    border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
  }
  .btn-config-toggle:hover {
    background: var(--neon-yellow);
    color: var(--bg-dark);
    box-shadow: 0 0 8px rgba(252, 238, 10, 0.4);
  }

  label {
    display: block;
    font-size: 0.72rem;
    color: var(--neon-cyan);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid rgba(0, 243, 255, 0.4);
    color: var(--text-main);
    padding: 8px 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    margin-bottom: 10px;
    outline: none;
    transition: all 0.25s ease-in-out;
    border-radius: 2px;
  }

  input:focus, select:focus {
    border-color: var(--neon-cyan);
    box-shadow: var(--border-glow);
    background: #16182a;
  }

  .btn-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  button {
    background: transparent;
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    padding: 8px 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 2px;
  }

  button:hover { background: var(--neon-cyan); color: var(--bg-dark); box-shadow: var(--border-glow); }

  button.btn-magenta { border-color: var(--neon-magenta); color: var(--neon-magenta); }
  button.btn-magenta:hover { background: var(--neon-magenta); color: var(--bg-dark); box-shadow: var(--border-magenta); }

  button.btn-yellow { border-color: var(--neon-yellow); color: var(--neon-yellow); }
  button.btn-yellow:hover { background: var(--neon-yellow); color: var(--bg-dark); box-shadow: 0 0 10px var(--neon-yellow); }

  button.btn-green { border-color: var(--neon-green); color: var(--neon-green); }
  button.btn-green:hover { background: var(--neon-green); color: var(--bg-dark); box-shadow: 0 0 10px var(--neon-green); }

  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:disabled:hover { background: transparent; color: inherit; box-shadow: none; }

  .editor-info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.6);
    border-left: 3px solid var(--neon-cyan);
    border-right: 1px solid rgba(0, 243, 255, 0.2);
    flex-shrink: 0;
  }

  .editor-container {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  #editor {
    flex: 1;
    background: rgba(5, 5, 8, 0.85);
    border: 1px solid rgba(0, 243, 255, 0.3);
    padding: 24px;
    color: var(--text-main);
    font-size: 16px;
    line-height: 1.7;
    overflow-y: auto;
    outline: none;
    position: relative;
    scroll-behavior: smooth;
    word-wrap: break-word;
  }

  #editor:focus {
    border-color: var(--neon-cyan);
    box-shadow: inset 0 0 25px rgba(0, 243, 255, 0.08);
  }

  #editor * { max-width: 100%; }

  #rawHtmlViewer {
    display: none;
    flex: 1;
    background: #020204;
    border: 1px solid var(--neon-magenta);
    padding: 20px;
    color: var(--neon-cyan);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    resize: none;
    white-space: pre-wrap;
    overflow-y: auto;
  }

  #editor .search-highlight {
    background: rgba(252, 238, 10, 0.25) !important;
    color: var(--neon-yellow) !important;
    border-bottom: 2px solid var(--neon-yellow);
    padding: 0 2px;
    border-radius: 2px;
    text-shadow: 0 0 5px var(--neon-yellow);
  }

  #editor .search-highlight.active-match {
    background: var(--neon-magenta) !important;
    color: #ffffff !important;
    border-bottom: 2px solid #ffffff;
    text-shadow: 0 0 10px #ffffff;
    box-shadow: 0 0 15px var(--neon-magenta);
  }

  .search-widget {
    background: linear-gradient(90deg, rgba(252, 238, 10, 0.12) 0%, rgba(13, 14, 23, 0.8) 100%);
    border: 1px solid var(--neon-yellow);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 0 15px rgba(252, 238, 10, 0.15);
    border-radius: var(--radius);
    flex-wrap: wrap;
  }

  .search-widget label {
    margin: 0;
    color: var(--neon-yellow);
    white-space: nowrap;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .search-widget input {
    margin: 0;
    flex: 1;
    min-width: 160px;
    border-color: var(--neon-yellow);
    background: rgba(0, 0, 0, 0.6);
  }

  .search-widget button {
    border-color: var(--neon-yellow);
    color: var(--neon-yellow);
    margin: 0;
    padding: 6px 9px;
  }
  .search-widget button:hover:not(:disabled) { background: var(--neon-yellow); color: var(--bg-dark); }

  .search-nav-btn {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--neon-cyan) !important;
    color: var(--neon-cyan) !important;
    width: 30px;
    height: 30px;
    padding: 0 !important;
    font-size: 0.7rem;
  }
  .search-nav-btn:hover:not(:disabled) {
    background: var(--neon-cyan) !important;
    color: var(--bg-dark) !important;
  }

  .search-highlight-toggle {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--neon-magenta) !important;
    color: var(--neon-magenta) !important;
    width: 30px;
    height: 30px;
    padding: 0 !important;
    font-size: 0.7rem;
  }
  .search-highlight-toggle.active {
    background: var(--neon-magenta) !important;
    color: #fff !important;
  }
  .search-highlight-toggle:hover:not(:disabled) { background: var(--neon-magenta) !important; color: #fff !important; }

  .search-counter {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.78rem;
    color: var(--neon-green);
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 255, 102, 0.4);
    padding: 4px 10px;
    border-radius: var(--radius);
    min-width: 58px;
    text-align: center;
    letter-spacing: 1px;
  }

  .search-info {
    font-size: 0.78rem;
    color: var(--text-dim);
    white-space: nowrap;
    min-width: 110px;
    text-align: right;
  }

  .format-toolbar {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    background: linear-gradient(90deg, rgba(0, 243, 255, 0.08) 0%, var(--bg-panel) 100%);
    border: 1px solid var(--neon-cyan);
    flex-wrap: wrap;
    align-items: flex-end;
    border-radius: var(--radius);
    box-shadow: 0 0 12px rgba(0, 243, 255, 0.12);
  }

  .format-toolbar > div {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .format-toolbar label {
    font-size: 0.68rem;
    color: var(--neon-cyan);
    margin-bottom: 0;
  }

  .format-toolbar select,
  .format-toolbar input[type="color"] {
    width: auto;
    min-width: 80px;
    margin-bottom: 0;
    padding: 6px 8px;
    font-size: 0.8rem;
  }

  .format-toolbar input[type="color"] {
    height: 34px;
    padding: 2px;
    cursor: pointer;
    background: var(--bg-input);
  }

  .format-buttons {
    display: flex !important;
    flex-direction: row !important;
    gap: 4px !important;
    align-items: flex-end;
  }

  .fmt-btn {
    width: 36px;
    height: 36px;
    padding: 0 !important;
    font-size: 0.9rem;
    border-color: var(--neon-cyan) !important;
    color: var(--neon-cyan) !important;
  }
  .fmt-btn:hover { background: var(--neon-cyan) !important; color: var(--bg-dark) !important; }
  .fmt-btn.active {
    background: var(--neon-cyan) !important;
    color: var(--bg-dark) !important;
    box-shadow: var(--border-glow);
  }

  .btn-apply-fmt {
    border-color: var(--neon-green) !important;
    color: var(--neon-green) !important;
    padding: 8px 16px !important;
    font-weight: bold;
    letter-spacing: 1px;
    height: 36px;
    animation: glow-green 2s infinite;
  }
  .btn-apply-fmt:hover { background: var(--neon-green) !important; color: var(--bg-dark) !important; }

  @keyframes glow-green {
    0%, 100% { box-shadow: 0 0 6px rgba(0, 255, 102, 0.4); }
    50% { box-shadow: 0 0 16px rgba(0, 255, 102, 0.8); }
  }

  .btn-clear-fmt {
    border-color: var(--neon-magenta) !important;
    color: var(--neon-magenta) !important;
    padding: 8px 16px !important;
    font-weight: bold;
    letter-spacing: 1px;
    height: 36px;
    animation: glow-magenta 2s infinite;
  }
  .btn-clear-fmt:hover { background: var(--neon-magenta) !important; color: #fff !important; }

  @keyframes glow-magenta {
    0%, 100% { box-shadow: 0 0 6px rgba(255, 0, 85, 0.4); }
    50% { box-shadow: 0 0 16px rgba(255, 0, 85, 0.8); }
  }

  .btn-nav-top, .btn-nav-bottom {
    padding: 8px 12px;
    min-width: 44px;
    font-size: 0.9rem;
    height: 36px;
  }
  .btn-nav-top { border-color: var(--neon-cyan) !important; color: var(--neon-cyan) !important; }
  .btn-nav-top:hover { background: var(--neon-cyan) !important; color: var(--bg-dark) !important; box-shadow: var(--border-glow); }
  .btn-nav-bottom { border-color: var(--neon-green) !important; color: var(--neon-green) !important; }
  .btn-nav-bottom:hover { background: var(--neon-green) !important; color: var(--bg-dark) !important; box-shadow: 0 0 10px var(--neon-green); }

  .format-hint {
    font-size: 0.7rem;
    color: var(--neon-yellow);
    background: rgba(252, 238, 10, 0.1);
    border: 1px solid rgba(252, 238, 10, 0.4);
    padding: 4px 8px;
    border-radius: var(--radius);
    align-self: center;
    margin-left: auto;
    white-space: nowrap;
  }

  .toast-bar {
    padding: 8px 12px;
    font-size: 0.8rem;
    border-radius: var(--radius);
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    word-break: break-word;
  }
  .toast-info { background: rgba(0, 243, 255, 0.15); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }
  .toast-success { background: rgba(0, 255, 102, 0.15); border: 1px solid var(--neon-green); color: var(--neon-green); }
  .toast-error { background: rgba(255, 0, 85, 0.15); border: 1px solid var(--neon-magenta); color: var(--neon-magenta); }

  .debug-box {
    margin-top: 10px;
    background: #020204;
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    padding: 8px 10px;
    border: 1px solid rgba(0, 255, 102, 0.3);
    border-radius: var(--radius);
    max-height: 140px;
    overflow-y: auto;
    line-height: 1.45;
    display: none;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--neon-magenta); }

  @media (max-width: 850px) {
    html, body { height: 100vh; overflow: hidden; }
    .main-container { flex-direction: column; }
    .editor-wrapper { padding: 8px; gap: 8px; }
    .editor-container { min-height: 0; }
    #editor { padding: 12px; font-size: 15px; }
    header { padding: 10px 14px; }
    header h1 { font-size: 1rem; letter-spacing: 1px; }
    .status-indicator { font-size: 0.68rem; padding: 4px 10px; }
    .editor-info-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
    .editor-info-bar > div { width: 100%; justify-content: space-between; align-items: center; display: flex; }
    .search-widget { padding: 8px 10px; gap: 6px; }
    .search-widget label { font-size: 0.7rem; }
    .search-widget input { font-size: 0.85rem; min-width: 100%; order: 2; }
    .search-counter { order: 3; }
    .search-nav-btn, .search-highlight-toggle, .search-widget .btn-magenta { order: 4; }
    .search-info { order: 5; text-align: left; min-width: 0; width: 100%; }
    .format-toolbar { gap: 6px; padding: 8px; }
    .format-toolbar > div { flex: 1 1 calc(50% - 6px); min-width: 100px; }
    .format-toolbar select, .format-toolbar input[type="color"] { width: 100%; min-width: 0; }
    .format-hint { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1><i class="fa-solid fa-terminal"></i> GRAPHZO EDITOR <span style="color: var(--neon-magenta);">v1.3</span></h1>
  <div class="status-indicator">
    <div class="pulse" id="statusPulse"></div>
    <span id="statusText">LINK ACTIVE</span>
  </div>
</header>

<div class="main-container">
  <main class="editor-wrapper">

    <div class="editor-info-bar">
      <span>LIVRO: <strong id="currentFileName" style="color: var(--neon-cyan);">nenhum_livro_aberto.html</strong></span>
      <div style="display: flex; gap: 10px; align-items: center;">
        <span id="editorStatusText" style="color: var(--neon-yellow);"></span>
        <button class="btn-config-toggle" onclick="toggleConfigPanel()" title="Abrir/Fechar Configurações">
          <i class="fa-solid fa-sliders"></i> Configurações
        </button>
      </div>
    </div>

    <!-- PAINEL DE CONFIGURAÇÕES CENTRAL (Contém TUDO) -->
    <div class="config-panel" id="configPanel">
      <div class="config-header" onclick="toggleConfigPanel()">
        <span><i class="fa-solid fa-gear"></i> Painel de Controle Completo</span>
        <i class="fa-solid fa-chevron-down" id="configArrow"></i>
      </div>
      <div class="config-body">
        
        <!-- SEÇÃO 1: GITHUB -->
        <div class="config-section">
          <div class="section-title"><i class="fa-brands fa-github"></i> // CONEXÃO GITHUB</div>
          <label><i class="fa-solid fa-key"></i> Token Number</label>
          <input type="password" id="ghToken" placeholder="Cole o token do GitHub..." onchange="persistConfig()">
          <label><i class="fa-solid fa-box-archive"></i> Repositório</label>
          <input type="text" id="ghRepo" placeholder="usuario/repositorio" value="andreyoldekamp-del/GraphZoBackup" onchange="persistConfig()">
          <label><i class="fa-solid fa-folder"></i> Pasta</label>
          <input type="text" id="ghFolder" placeholder="historias" value="historias" onchange="persistConfig()">
          <label><i class="fa-solid fa-list-check"></i> Selecionar da Pasta</label>
          <select id="ghFileSelect" onchange="onSelectFileChange()">
            <option value="">-- Clique em Listar --</option>
          </select>
          <div class="btn-group">
            <button onclick="listFiles()"><i class="fa-solid fa-rotate"></i> Listar</button>
            <button onclick="loadFile()" class="btn-magenta"><i class="fa-solid fa-cloud-arrow-down"></i> Carregar</button>
            <button onclick="saveFile()" class="btn-yellow" id="btnSaveGh"><i class="fa-solid fa-cloud-arrow-up"></i> Salvar</button>
            <button onclick="deleteFile()" class="btn-magenta" title="Deletar arquivo do GitHub"><i class="fa-solid fa-trash-can"></i> Deletar</button>
          </div>
          <div id="toastGh" class="toast-bar"></div>
        </div>

        <!-- SEÇÃO 2: CONTROLES LOCAIS -->
        <div class="config-section">
          <div class="section-title"><i class="fa-solid fa-microchip"></i> // CONTROLES LOCAIS</div>
          <input type="file" id="localFileInput" style="display:none;" accept=".html,.xhtml,.txt,.md" onchange="handleLocalFile(event)">

/* ============================================================
   BASE64 → UTF-8
   ============================================================ */
function safeBase64Decode(b64) {
  const clean = String(b64).replace(/\s/g, '');
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  let text = new TextDecoder('utf-8').decode(bytes);
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  return text;
}

/* ============================================================
   NORMALIZAÇÃO DE CORES ESCURAS
   ============================================================ */
function normalizeDarkColors(container) {
  if (!container) return;
  const DARK_THRESHOLD = 180;
  const LIGHT_REPLACEMENT = '#e0e6ed';
  const BG_REPLACEMENT = 'transparent';

  function parseRgb(str) {
    if (!str) return null;
    const m = str.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+)\s*)?\)/i);
    if (!m) return null;
    return { r: +m[1], g: +m[2], b: +m[3], a: m[4] !== undefined ? +m[4] : 1 };
  }
  function parseHex(str) {
    if (!str) return null;
    const m = str.trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
    if (!m) return null;
    let hex = m[1];
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    return {
      r: parseInt(hex.substring(0, 2), 16),
      g: parseInt(hex.substring(2, 4), 16),
      b: parseInt(hex.substring(4, 6), 16)
    };
  }
  function luminance(str) {
    const rgb = parseRgb(str) || parseHex(str);
    if (!rgb) return null;
    return 0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b;
  }
  function fixElement(el) {
    try {
      if (!el || el.nodeType !== 1) return;
      if (el === container) return;
      if (el.tagName === 'STYLE' || el.tagName === 'SCRIPT') return;
      const computed = window.getComputedStyle(el);
      const colorLum = luminance(computed.color);
      const bgLum = luminance(computed.backgroundColor);
      if (colorLum !== null && colorLum < DARK_THRESHOLD) el.style.color = LIGHT_REPLACEMENT;
      if (bgLum !== null && bgLum < DARK_THRESHOLD) {
        const bg = parseRgb(computed.backgroundColor);
        if (bg && bg.a > 0.05) el.style.backgroundColor = BG_REPLACEMENT;
      }
      if (el.tagName === 'FONT' && el.hasAttribute('color')) {
        const fLum = luminance(el.getAttribute('color'));
        if (fLum !== null && fLum < DARK_THRESHOLD) {
          el.removeAttribute('color');
          el.style.color = LIGHT_REPLACEMENT;
        }
      }
    } catch (e) {}
  }
  const all = Array.from(container.querySelectorAll('*'));
  const BATCH = 250;
  for (let i = 0; i < all.length; i += BATCH) {
    all.slice(i, i + BATCH).forEach(fixElement);
  }
  fixElement(container);
}

/* ============================================================
   EXTRATOR DE <body>
   ============================================================ */
function extractReadableHtml(raw) {
  if (!raw) return '';
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(raw, 'application/xhtml+xml');
    if (!doc.querySelector('parsererror')) {
      const body = doc.querySelector('body');
      if (body && body.innerHTML.trim()) return body.innerHTML;
      const html = doc.querySelector('html');
      if (html && html.innerHTML.trim()) return html.innerHTML;
    }
  } catch (e) {}
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(raw, 'text/html');
    const body = doc.querySelector('body');
    if (body && body.innerHTML.trim()) return body.innerHTML;
  } catch (e) {}
  return raw;
}

function updateFileLabels() {
  document.getElementById('currentFileName').textContent = state.fileName || 'nenhum_livro_aberto.html';
  document.getElementById('infoName').textContent = state.fileName || '-';
}

/* ============================================================
   FORMATAÇÃO — APLICAR NA SELEÇÃO
   ============================================================ */
function saveSelection() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    const editor = document.getElementById('editor');
    if (editor.contains(range.commonAncestorContainer)) {
      state.savedRange = range.cloneRange();
      return true;
    }
  }
  return false;
}

function restoreSelection() {
  if (!state.savedRange) return false;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(state.savedRange);
  return true;
}

function hasSelectionInEditor() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return false;
  if (sel.isCollapsed) return false;
  const editor = document.getElementById('editor');
  return editor.contains(sel.getRangeAt(0).commonAncestorContainer);
}

function applyInlineCommand(cmd) {
  const editor = document.getElementById('editor');
  editor.focus();
  if (state.savedRange) restoreSelection();
  try {
    document.execCommand(cmd, false, null);
    updateFormatButtons();
    log(`Formatação aplicada: ${cmd}`, 'ok');
  } catch (e) {
    showToast(`Erro ao aplicar ${cmd}: ${e.message}`, 'error');
  }
}

function updateFormatButtons() {
  const cmds = { fmtBold: 'bold', fmtItalic: 'italic', fmtUnderline: 'underline', fmtStrike: 'strikeThrough' };
  for (const [id, cmd] of Object.entries(cmds)) {
    const btn = document.getElementById(id);
    if (!btn) continue;
    try {
      if (document.queryCommandState(cmd)) btn.classList.add('active');
      else btn.classList.remove('active');
    } catch (e) { btn.classList.remove('active'); }
  }
}

function applyFormatToSelection() {
  const editor = document.getElementById('editor');

  if (!hasSelectionInEditor()) {
    if (state.savedRange) restoreSelection();
    if (!hasSelectionInEditor()) {
      showToast('Selecione um trecho de texto no editor primeiro!', 'error');
      document.getElementById('formatHint').innerHTML =
        '<i class="fa-solid fa-triangle-exclamation"></i> <strong style="color: var(--neon-magenta);">Nenhum texto selecionado!</strong>';
      setTimeout(() => {
        document.getElementById('formatHint').innerHTML =
          '<i class="fa-solid fa-info-circle"></i> Selecione um trecho no editor e clique em <strong>Aplicar Formatação</strong>';
      }, 3000);
      return;
    }
  }

  const font = document.getElementById('fontFamily').value;
  const size = document.getElementById('fontSize').value;
  const color = document.getElementById('textColor').value;
  const bg = document.getElementById('bgColor').value;

  editor.focus();

  try { document.execCommand('fontName', false, font); } catch (e) { log(`fontName falhou: ${e.message}`, 'error'); }
  try { document.execCommand('fontSize', false, '7'); } catch (e) { log(`fontSize falhou: ${e.message}`, 'error'); }
  try { document.execCommand('foreColor', false, color); } catch (e) { log(`foreColor falhou: ${e.message}`, 'error'); }
  try { document.execCommand('hiliteColor', false, bg); } catch (e) { log(`hiliteColor falhou: ${e.message}`, 'error'); }

  fixFontSizeInSelection(size);

  updateFormatButtons();
  showToast(`Formatação aplicada: ${font.split(',')[0]} / ${size}`, 'success');
  log(`Formatação aplicada — fonte=${font} size=${size} cor=${color} fundo=${bg}`, 'ok');

  state.savedRange = null;
}

function fixFontSizeInSelection(sizePx) {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const editor = document.getElementById('editor');

  const container = range.commonAncestorContainer;
  const root = container.nodeType === 1 ? container : container.parentNode;
  if (!root || !editor.contains(root)) return;

  const fontTags = [];
  if (root.tagName === 'FONT' && root.getAttribute('size') === '7') fontTags.push(root);
  root.querySelectorAll('font[size="7"]').forEach(f => fontTags.push(f));

  fontTags.forEach(fontEl => {
    const span = document.createElement('span');
    span.style.fontSize = sizePx;
    span.style.fontFamily = document.getElementById('fontFamily').value;
    while (fontEl.firstChild) span.appendChild(fontEl.firstChild);
    fontEl.parentNode.replaceChild(span, fontEl);
  });

  const allFonts = editor.querySelectorAll('font');
  allFonts.forEach(f => {
    if (range.intersectsNode(f)) {
      f.style.fontFamily = document.getElementById('fontFamily').value;
      f.style.fontSize = sizePx;
    }
  });
}

/* ============================================================
   LIMPAR FORMATAÇÃO DA SELEÇÃO (ANTI-WORD HYPERLINK)
   ============================================================ */
function clearFormatToSelection() {
  const editor = document.getElementById('editor');

  if (!hasSelectionInEditor()) {
    if (state.savedRange) restoreSelection();
    if (!hasSelectionInEditor()) {
      showToast('Selecione um trecho de texto no editor primeiro!', 'error');
      document.getElementById('formatHint').innerHTML =
        '<i class="fa-solid fa-triangle-exclamation"></i> <strong style="color: var(--neon-magenta);">Nenhum texto selecionado!</strong>';
      setTimeout(() => {
        document.getElementById('formatHint').innerHTML =
          '<i class="fa-solid fa-info-circle"></i> Selecione um trecho no editor e clique em <strong>Aplicar Formatação</strong>';
      }, 3000);
      return;
    }
  }

  editor.focus();

  try { document.execCommand('removeFormat', false, null); } catch (e) { log(`removeFormat falhou: ${e.message}`, 'error'); }

  try {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      
      const links = editor.querySelectorAll('a');
      links.forEach(a => {
        if (range.intersectsNode(a)) {
          const parent = a.parentNode;
          while (a.firstChild) {
            parent.insertBefore(a.firstChild, a);
          }
          parent.removeChild(a);
        }
      });

      editor.querySelectorAll('font').forEach(f => {
        if (range.intersectsNode(f)) {
          f.removeAttribute('color');
          f.removeAttribute('face');
          f.removeAttribute('size');
          f.removeAttribute('style');
        }
      });

      editor.querySelectorAll('[style]').forEach(el => {
        if (range.intersectsNode(el) && el !== editor) {
          el.style.textDecoration = 'none';
          el.style.color = '#ffffff';
          el.style.backgroundColor = 'transparent';
          if (el.className && el.className.toLowerCase().includes('mso')) {
            el.removeAttribute('class');
          }
        }
      });
    }
  } catch (e) { log(`Limpeza residual falhou: ${e.message}`, 'error'); }

  try { document.execCommand('fontName', false, 'Arial, sans-serif'); } catch (e) {}
  try { document.execCommand('fontSize', false, '7'); } catch (e) {}
  try { document.execCommand('foreColor', false, '#ffffff'); } catch (e) {}
  try { document.execCommand('hiliteColor', false, 'transparent'); } catch (e) {}
  try { document.execCommand('underline', false, null); } catch (e) {}

  try {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      
      editor.querySelectorAll('font[size="7"]').forEach(fontEl => {
        if (range.intersectsNode(fontEl)) {
          const span = document.createElement('span');
          span.style.fontFamily = 'Arial, sans-serif';
          span.style.fontSize = '12px';
          span.style.color = '#ffffff';
          span.style.backgroundColor = 'transparent';
          span.style.textDecoration = 'none';
          while (fontEl.firstChild) span.appendChild(fontEl.firstChild);
          fontEl.parentNode.replaceChild(span, fontEl);
        }
      });

      editor.querySelectorAll('span, p, div, h1, h2, h3, h4, h5, h6').forEach(el => {
        if (range.intersectsNode(el)) {
          el.style.fontFamily = 'Arial, sans-serif';
          el.style.fontSize = '12px';
          el.style.color = '#ffffff';
          el.style.backgroundColor = 'transparent';
          el.style.textDecoration = 'none';
        }
      });
    }
  } catch (e) { log(`Aplicação padrão falhou: ${e.message}`, 'error'); }

  document.getElementById('fontFamily').value = 'Arial, sans-serif';
  document.getElementById('fontSize').value = '12px';
  document.getElementById('textColor').value = '#ffffff';
  document.getElementById('bgColor').value = '#050508';

  updateFormatButtons();
  showToast('Formatação removida (incluindo hiperlinks do Word) — Arial 12px branco aplicado.', 'success');
  log('Limpeza de formatação aplicada na seleção, hiperlinks removidos.', 'ok');

  state.savedRange = null;
}

/* ============================================================
   LISTAR ARQUIVOS
   ============================================================ */
async function listFiles() {
  persistConfig();
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const folder = document.getElementById('ghFolder').value.trim();
  const select = document.getElementById('ghFileSelect');

  if (!token || !repo) {
    showToast('Informe pelo menos o Token e o Repositório!', 'error');
    return;
  }

  select.innerHTML = '<option value="">⏳ Consultando API...</option>';
  
  const url = `https://api.github.com/repos/${repo}/contents/${folder}?t=${Date.now()}`;
  log(`GET ${url}`);

  try {
    const response = await fetch(url, {
      headers: { 
        'Authorization': `Bearer ${token}`, 
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    
    if (!response.ok) {
      const body = await response.text();
      throw new Error(`HTTP ${response.status} — ${body.substring(0, 150)}`);
    }

    const data = await response.json();
    if (!Array.isArray(data)) throw new Error('Resposta inesperada da API.');

    select.innerHTML = '<option value="">-- Selecione um livro --</option>';
    const files = data.filter(item => item.type === 'file');
    files.sort((a, b) => a.name.localeCompare(b.name)).forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.path;
      opt.textContent = f.name;
      select.appendChild(opt);
    });

    showToast(`${files.length} arquivo(s) encontrado(s).`, 'success');
    log(`Listados ${files.length} arquivos.`, 'ok');

    const lastFile = localStorage.getItem(STORAGE_KEYS.LAST_FILE);
    if (lastFile && Array.from(select.options).some(o => o.value === lastFile)) {
      select.value = lastFile;
      log(`Auto-carregando último arquivo: ${lastFile}`);
      loadFile(lastFile);
    } else if (lastFile && !Array.from(select.options).some(o => o.value === lastFile)) {
      localStorage.removeItem(STORAGE_KEYS.LAST_FILE);
    }
  } catch (err) {
    select.innerHTML = '<option value="">❌ Falha ao listar</option>';
    showToast(`Erro ao listar: ${err.message}`, 'error');
    log(`Erro list: ${err.message}`, 'error');
  }
}

function onSelectFileChange() {
  const select = document.getElementById('ghFileSelect');
  if (select.value) loadFile(select.value);
}

/* ============================================================
   CARREGAR ARQUIVO
   ============================================================ */
async function loadFile(customPath = null) {
  persistConfig();
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const folder = document.getElementById('ghFolder').value.trim() || 'historias';

  let path = customPath || document.getElementById('ghFileSelect').value;

  if (!token || !repo || !path) {
    showToast('Preencha Token, Repositório e o Arquivo!', 'error');
    return;
  }

  if (!path.includes('/')) {
    const originalPath = path;
    path = `${folder}/${path}`;
    log(`Path sem pasta detectado — ajustado: "${originalPath}" → "${path}"`, 'info');
  }

  showToast(`Carregando ${path}...`, 'info');
  setStatus('BAIXANDO DADOS...', 'var(--neon-cyan)');
  document.getElementById('editorStatusText').textContent = 'CARREGANDO...';
  log(`Carregando: ${path}`);

  const headers = {
    'Authorization': `Bearer ${token}`,
    'Accept': 'application/vnd.github.v3+json'
  };

  try {
    let metaRes = await fetch(
      `https://api.github.com/repos/${repo}/contents/${path}`,
      { headers }
    );

    if (metaRes.status === 404 && path.includes('/')) {
      const fileNameOnly = path.split('/').pop();
      log(`404 com "${path}" — tentando raiz: "${fileNameOnly}"`, 'info');
      const fallbackRes = await fetch(
        `https://api.github.com/repos/${repo}/contents/${fileNameOnly}`,
        { headers }
      );
      if (fallbackRes.ok) {
        log(`✅ Encontrado na raiz: ${fileNameOnly}`, 'ok');
        path = fileNameOnly;
        metaRes = fallbackRes;
      }
    }

    if (!metaRes.ok) {
      const body = await metaRes.text();
      throw new Error(`Metadados HTTP ${metaRes.status} — ${body.substring(0, 150)}`);
    }

    const meta = await metaRes.json();

    state.sha = meta.sha || '';
    state.path = path;
    state.fileName = path.split('/').pop();

    log(`Meta OK — sha=${meta.sha ? meta.sha.substring(0,7) : '?'} size=${meta.size} encoding=${meta.encoding || 'none'}`);

    let decoded = '';
    if (meta.content && meta.encoding === 'base64') {
      try {
        decoded = safeBase64Decode(meta.content);
        log(`Content direto: ${decoded.length} chars.`);
      } catch (e) {
        log(`Falha content direto (${e.message}) — indo para blob.`, 'error');
        decoded = '';
      }
    }

    if (!decoded) {
      log('Buscando via git/blobs...');
      const blobUrl = `https://api.github.com/repos/${repo}/git/blobs/${meta.sha}`;
      const blobRes = await fetch(blobUrl, { headers });
      if (!blobRes.ok) {
        const body = await blobRes.text();
        throw new Error(`Blob HTTP ${blobRes.status} — ${body.substring(0, 150)}`);
      }
      const blob = await blobRes.json();
      if (!blob.content) throw new Error('Blob sem conteúdo.');
      decoded = safeBase64Decode(blob.content);
      log(`Blob decodificado: ${decoded.length} chars.`);
    }

    if (!decoded || decoded.trim().length === 0) {
      throw new Error('Conteúdo vazio. Verifique o arquivo no repositório.');
    }

    const readable = extractReadableHtml(decoded);
    log(`Corpo extraído: ${readable.length} chars.`);

    const editor = document.getElementById('editor');
    editor.innerHTML = readable;

    try { normalizeDarkColors(editor); } catch (e) { log(`Normalização falhou: ${e.message}`, 'error'); }

    const visibleChars = (editor.innerText || '').trim().length;
    log(`Editor tem ${visibleChars} caracteres visíveis.`);
    if (visibleChars === 0) {
      log('⚠️ Editor vazio — restaurando HTML bruto.', 'error');
      editor.innerHTML = decoded;
    }

    document.getElementById('rawHtmlViewer').value = decoded;
    updateFileLabels();
    document.getElementById('infoSHA').textContent = state.sha ? state.sha.substring(0, 8) : '---';

    localStorage.setItem(STORAGE_KEYS.LAST_FILE, state.path);

    clearHighlights();
    document.getElementById('searchInput').value = '';

    const select = document.getElementById('ghFileSelect');
    if (select) {
      const opt = Array.from(select.options).find(o => o.value === state.path);
      if (opt) select.value = state.path;
    }

    showToast(`"${state.fileName}" carregado! (${decoded.length} chars)`, 'success');
    setStatus('NEURAL LINK ACTIVE', 'var(--neon-yellow)');
    document.getElementById('editorStatusText').textContent = 'PRONTO';
    log(`✅ Sucesso. Editor pronto.`, 'ok');

  } catch (err) {
    log(`❌ Erro load: ${err.message}`, 'error');
    showToast(`Erro ao carregar: ${err.message}`, 'error');
    setStatus('ERRO DE SINC', 'var(--neon-magenta)');
    document.getElementById('editorStatusText').textContent = 'ERRO';
  }
}

/* ============================================================
   SALVAR ARQUIVO
   ============================================================ */
async function saveFile() {
  persistConfig();
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();

  let path = state.path;
  if (!path && state.fileName) {
    const folder = document.getElementById('ghFolder').value.trim() || 'historias';
    path = `${folder}/${state.fileName}`;
    state.path = path;
    log(`Caminho reconstruído a partir do nome: ${path}`);
  }

  if (!token || !repo) { showToast('Preencha Token e Repositório!', 'error'); return; }
  if (!path) { showToast('Nenhum arquivo aberto para salvar!', 'error'); return; }
  if (!state.fileName) { showToast('Nome do arquivo não definido!', 'error'); return; }

  showToast(`Sincronizando "${state.fileName}" no GitHub...`, 'info');
  setStatus('GRAVANDO NO GITHUB...', 'var(--neon-cyan)');
  document.getElementById('editorStatusText').textContent = 'SALVANDO...';

  try {
    const html = state.isRawView
      ? document.getElementById('rawHtmlViewer').value
      : document.getElementById('editor').innerHTML;

    const encoder = new TextEncoder();
    const data = encoder.encode(html);
    let binary = '';
    for (let i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
    const base64Content = btoa(binary);

    const bodyData = {
      message: `Atualizado via GraphZo Cyberpunk - ${state.fileName} - ${new Date().toLocaleString('pt-BR')}`,
      content: base64Content
    };
    if (state.sha) bodyData.sha = state.sha;

    const url = `https://api.github.com/repos/${repo}/contents/${path}`;
    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(bodyData)
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.message || `HTTP ${res.status}`);
    }

    const resData = await res.json();
    state.sha = resData.content.sha;
    state.path = path;
    state.fileName = path.split('/').pop();
    document.getElementById('infoSHA').textContent = state.sha.substring(0, 8);

    localStorage.setItem(STORAGE_KEYS.LAST_FILE, state.path);
    updateFileLabels();

    showToast(`"${state.fileName}" salvo com sucesso!`, 'success');
    setStatus('LINK ACTIVE', 'var(--neon-yellow)');
    document.getElementById('editorStatusText').textContent = 'PRONTO';
    log(`✅ Salvo: ${path}`, 'ok');
  } catch (err) {
    showToast(`Erro ao salvar: ${err.message}`, 'error');
    setStatus('ERRO DE GRAVAÇÃO', 'var(--neon-magenta)');
    document.getElementById('editorStatusText').textContent = 'ERRO';
    log(`❌ Erro save: ${err.message}`, 'error');
  }
}

/* ============================================================
   DELETAR ARQUIVO DO GITHUB
   ============================================================ */
async function deleteFile() {
  persistConfig();
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const folder = document.getElementById('ghFolder').value.trim() || 'historias';

  const select = document.getElementById('ghFileSelect');
  let path = (select && select.value) ? select.value : state.path;

  if (!path && state.fileName) {
    path = `${folder}/${state.fileName}`;
  }

  if (!token || !repo) {
    showToast('Informe o Token e o Repositório!', 'error');
    return;
  }
  if (!path) {
    showToast('Selecione um arquivo na lista para deletar!', 'error');
    return;
  }

  const fileName = path.split('/').pop();
  if (!confirm(`⚠️ ATENÇÃO: Tem certeza que deseja DELETAR permanentemente "${fileName}" do GitHub?\n\nEsta ação não pode ser desfeita!`)) {
    return;
  }

  showToast(`Verificando metadados de "${fileName}"...`, 'info');
  setStatus('VERIFICANDO...', 'var(--neon-magenta)');

  try {
    let metaUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
    let metaRes = await fetch(metaUrl, {
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });

    let actualPath = path;

    if (!metaRes.ok) {
      if (metaRes.status === 404 && path.includes('/')) {
        const fileNameOnly = path.split('/').pop();
        const fallbackUrl = `https://api.github.com/repos/${repo}/contents/${fileNameOnly}`;
        const fallbackRes = await fetch(fallbackUrl, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        if (fallbackRes.ok) {
          actualPath = fileNameOnly;
          metaRes = fallbackRes;
        } else {
          throw new Error(`Arquivo não encontrado (HTTP ${metaRes.status})`);
        }
      } else {
        const errText = await metaRes.text();
        throw new Error(`Erro ao buscar metadados: HTTP ${metaRes.status}`);
      }
    }

    const meta = await metaRes.json();
    const fileSha = meta.sha;

    if (!fileSha) {
      throw new Error('Não foi possível obter o SHA do arquivo.');
    }

    showToast(`Deletando "${fileName}"...`, 'info');

    const deleteUrl = `https://api.github.com/repos/${repo}/contents/${actualPath}`;
    const deleteRes = await fetch(deleteUrl, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Deletado via GraphZo Cyberpunk - ${fileName} - ${new Date().toLocaleString('pt-BR')}`,
        sha: fileSha
      })
    });

    if (!deleteRes.ok) {
      const errData = await deleteRes.json().catch(() => ({}));
      throw new Error(errData.message || `HTTP ${deleteRes.status}`);
    }

    showToast(`"${fileName}" foi DELETADO com sucesso do GitHub!`, 'success');
    log(`✅ Arquivo deletado: ${actualPath}`, 'ok');
    
    const lastFile = localStorage.getItem(STORAGE_KEYS.LAST_FILE);
    if (lastFile === actualPath || lastFile === path) {
      localStorage.removeItem(STORAGE_KEYS.LAST_FILE);
      log('LAST_FILE removido do localStorage (arquivo deletado).', 'ok');
    }

    if (state.path === actualPath || state.fileName === fileName) {
      state.sha = '';
      state.path = '';
      state.fileName = '';
      document.getElementById('infoSHA').textContent = 'Não gravado';
      updateFileLabels();
      document.getElementById('editor').innerHTML = '';
      document.getElementById('rawHtmlViewer').value = '';
      showToast('Editor limpo pois o arquivo ativo foi deletado.', 'info');
    }

    await listFiles();

  } catch (err) {
    showToast(`Erro ao deletar: ${err.message}`, 'error');
    setStatus('ERRO NA EXCLUSÃO', 'var(--neon-magenta)');
    log(`❌ Erro delete: ${err.message}`, 'error');
  }
}

/* ============================================================
   AÇÕES LOCAIS
   ============================================================ */
function handleLocalFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const content = evt.target.result;
    const readable = extractReadableHtml(content);
    const editor = document.getElementById('editor');
    editor.innerHTML = readable;
    try { normalizeDarkColors(editor); } catch (e) {}
    document.getElementById('rawHtmlViewer').value = content;

    state.fileName = file.name;
    state.sha = '';
    const folder = document.getElementById('ghFolder').value.trim() || 'historias';
    state.path = `${folder}/${file.name}`;

    updateFileLabels();
    document.getElementById('infoSHA').textContent = 'Local (não salvo)';

    showToast(`Arquivo local "${file.name}" carregado.`, 'success');
    log(`Local carregado: ${file.name} → path: ${state.path}`, 'ok');
  };
  reader.readAsText(file, 'UTF-8');
}

function downloadPC() {
  const content = state.isRawView
    ? document.getElementById('rawHtmlViewer').value
    : document.getElementById('editor').innerHTML;
  const fileName = state.fileName || 'documento.html';
  const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = fileName;
  link.click();
  URL.revokeObjectURL(link.href);
}

function toggleRawCode() {
  const editor = document.getElementById('editor');
  const rawViewer = document.getElementById('rawHtmlViewer');
  state.isRawView = !state.isRawView;
  if (state.isRawView) {
    rawViewer.value = editor.innerHTML;
    editor.style.display = 'none';
    rawViewer.style.display = 'block';
    showToast('Modo HTML Bruto ativado', 'info');
  } else {
    editor.innerHTML = rawViewer.value;
    try { normalizeDarkColors(editor); } catch (e) {}
    rawViewer.style.display = 'none';
    editor.style.display = 'block';
    showToast('Modo Visual ativado', 'info');
  }
}

function clearEditor() {
  if (!confirm('Deseja realmente limpar todo o conteúdo e remover toda a formatação?')) return;

  const editor = document.getElementById('editor');
  const rawViewer = document.getElementById('rawHtmlViewer');

  editor.innerHTML = '';
  rawViewer.value = '';
  editor.removeAttribute('style');

  editor.style.fontFamily = "'Share Tech Mono', monospace";
  editor.style.fontSize = "16px";
  editor.style.color = "var(--text-main)";
  editor.style.backgroundColor = "rgba(5, 5, 8, 0.85)";
  editor.style.lineHeight = "1.7";

  const fontFamilySel = document.getElementById('fontFamily');
  const fontSizeSel = document.getElementById('fontSize');
  const textColorInput = document.getElementById('textColor');
  const bgColorInput = document.getElementById('bgColor');

  if (fontFamilySel) fontFamilySel.value = "'Share Tech Mono', monospace";
  if (fontSizeSel) fontSizeSel.value = "16px";
  if (textColorInput) textColorInput.value = "#e0e6ed";
  if (bgColorInput) bgColorInput.value = "#050508";

  state.savedRange = null;
  clearHighlights();
  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.value = '';

  state.sha = '';
  state.path = '';
  state.fileName = '';
  state.isRawView = false;

  editor.style.display = 'block';
  rawViewer.style.display = 'none';

  updateFileLabels();
  document.getElementById('infoSHA').textContent = 'Não gravado';

  localStorage.removeItem(STORAGE_KEYS.LAST_FILE);

  updateFormatButtons();
  editor.focus();

  showToast('Editor limpo e formatação restaurada ao padrão.', 'info');
  log('Editor limpo: conteúdo, estilos e metadados resetados.', 'ok');
}

/* ============================================================
   NAVEGAÇÃO RÁPIDA
   ============================================================ */
function scrollToTop() {
  const editor = document.getElementById('editor');
  if (editor) editor.scrollTo({ top: 0, behavior: 'smooth' });
}
function scrollToBottom() {
  const editor = document.getElementById('editor');
  if (editor) editor.scrollTo({ top: editor.scrollHeight, behavior: 'smooth' });
}

/* ============================================================
   BUSCA NEURAL
   ============================================================ */
function clearHighlights() {
  const editor = document.getElementById('editor');
  editor.querySelectorAll('.search-highlight').forEach(el => {
    const parent = el.parentNode;
    parent.replaceChild(document.createTextNode(el.textContent), el);
    parent.normalize();
  });
  state.searchHits = [];
  state.searchIndex = -1;
  state.searchTerm = '';
  updateSearchCounter();
  const info = document.getElementById('searchInfo');
  info.textContent = 'Aguardando termo...';
  info.style.color = 'var(--text-dim)';
}

function clearSearchWidget() {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.value = '';
  clearHighlights();
  showToast('Busca limpa.', 'info');
  log('Busca neural limpa via botão X.', 'ok');
}

function updateSearchCounter() {
  const counter = document.getElementById('searchCounter');
  const prev = document.getElementById('btnSearchPrev');
  const next = document.getElementById('btnSearchNext');
  const total = state.searchHits.length;
  const cur = state.searchIndex >= 0 ? state.searchIndex + 1 : 0;
  counter.textContent = `${cur}/${total}`;
  prev.disabled = total === 0;
  next.disabled = total === 0;
}

function applyHighlightAllMode() {
  const btn = document.getElementById('btnToggleHighlight');
  const marks = document.getElementById('editor').querySelectorAll('.search-highlight');
  if (state.highlightAll) {
    btn.classList.add('active');
    marks.forEach(m => m.style.visibility = 'visible');
  } else {
    btn.classList.remove('active');
    marks.forEach(m => m.style.visibility = 'hidden');
    if (state.searchIndex >= 0 && state.searchHits[state.searchIndex]) {
      state.searchHits[state.searchIndex].style.visibility = 'visible';
    }
  }
}

function highlightCurrentHit() {
  state.searchHits.forEach(m => m.classList.remove('active-match'));
  if (!state.highlightAll) state.searchHits.forEach(m => m.style.visibility = 'hidden');
  const current = state.searchHits[state.searchIndex];
  if (current) {
    current.classList.add('active-match');
    current.style.visibility = 'visible';
    const editor = document.getElementById('editor');
    const editorRect = editor.getBoundingClientRect();
    const markRect = current.getBoundingClientRect();
    const offset = markRect.top - editorRect.top + editor.scrollTop - 60;
    editor.scrollTo({ top: Math.max(0, offset), behavior: 'smooth' });
  }
  updateSearchCounter();
}

function performSearch() {
  const term = document.getElementById('searchInput').value;
  clearHighlights();
  if (!term || !term.trim()) return;

  state.searchTerm = term;
  const editor = document.getElementById('editor');
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null, false);
  const nodesToReplace = [];
  while (walker.nextNode()) {
    const node = walker.currentNode;
    if (node.nodeValue.toLowerCase().includes(term.toLowerCase())) {
      nodesToReplace.push(node);
    }
  }

  if (nodesToReplace.length === 0) {
    document.getElementById('searchInfo').textContent = 'Nenhum resultado';
    document.getElementById('searchInfo').style.color = 'var(--neon-magenta)';
    updateSearchCounter();
    return;
  }

  const escaped = term.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
  const regex = new RegExp(`(${escaped})`, 'gi');
  let count = 0;

  nodesToReplace.forEach(node => {
    const parent = node.parentNode;
    const temp = document.createElement('span');
    temp.innerHTML = node.nodeValue.replace(regex, '<mark class="search-highlight">$1</mark>');
    while (temp.firstChild) {
      const child = temp.firstChild;
      if (child.nodeType === 1 && child.classList && child.classList.contains('search-highlight')) count++;
      parent.insertBefore(child, node);
    }
    parent.removeChild(node);
  });

  state.searchHits = Array.from(editor.querySelectorAll('.search-highlight'));
  state.searchIndex = 0;
  applyHighlightAllMode();
  highlightCurrentHit();
  document.getElementById('searchInfo').textContent = `${count} ocorrência(s)`;
  document.getElementById('searchInfo').style.color = 'var(--neon-green)';
  log(`Busca "${term}": ${count} resultado(s).`);
}

function searchNext() {
  if (state.searchHits.length === 0) return;
  state.searchIndex = (state.searchIndex + 1) % state.searchHits.length;
  highlightCurrentHit();
}
function searchPrev() {
  if (state.searchHits.length === 0) return;
  state.searchIndex = (state.searchIndex - 1 + state.searchHits.length) % state.searchHits.length;
  highlightCurrentHit();
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  loadPersistedConfig();

  const editor = document.getElementById('editor');
  const searchInput = document.getElementById('searchInput');

  ['mouseup', 'keyup', 'input'].forEach(evt => {
    editor.addEventListener(evt, () => {
      saveSelection();
      updateFormatButtons();
    });
  });

  document.addEventListener('selectionchange', () => {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
      saveSelection();
      updateFormatButtons();
    }
  });

  document.getElementById('fmtBold').addEventListener('click', () => applyInlineCommand('bold'));
  document.getElementById('fmtItalic').addEventListener('click', () => applyInlineCommand('italic'));
  document.getElementById('fmtUnderline').addEventListener('click', () => applyInlineCommand('underline'));
  document.getElementById('fmtStrike').addEventListener('click', () => applyInlineCommand('strikeThrough'));

  document.getElementById('btnApplyFormat').addEventListener('click', applyFormatToSelection);
  document.getElementById('btnClearFormat').addEventListener('click', clearFormatToSelection);

  editor.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
      e.preventDefault(); applyInlineCommand('bold');
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'i') {
      e.preventDefault(); applyInlineCommand('italic');
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') {
      e.preventDefault(); applyInlineCommand('underline');
    }
  });

  let searchDebounce = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(performSearch, 250);
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (state.searchHits.length === 0) performSearch();
      else if (e.shiftKey) searchPrev();
      else searchNext();
    } else if (e.key === 'Escape') {
      clearSearchWidget();
      searchInput.blur();
    }
  });
  document.getElementById('btnSearchNext').addEventListener('click', () => {
    if (state.searchHits.length === 0) performSearch(); else searchNext();
  });
  document.getElementById('btnSearchPrev').addEventListener('click', () => {
    if (state.searchHits.length === 0) performSearch(); else searchPrev();
  });
  document.getElementById('btnToggleHighlight').addEventListener('click', () => {
    state.highlightAll = !state.highlightAll;
    applyHighlightAllMode();
    highlightCurrentHit();
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
  });

  editor.addEventListener('input', () => {
    if (state.isRawView) {
      document.getElementById('rawHtmlViewer').value = editor.innerHTML;
    }
  });
  document.getElementById('rawHtmlViewer').addEventListener('input', (e) => {
    editor.innerHTML = e.target.value;
  });

  log('GraphZo Editor v1.3 pronto.', 'ok');

  const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
  const repo = localStorage.getItem(STORAGE_KEYS.REPO);
  const folder = localStorage.getItem(STORAGE_KEYS.FOLDER) || 'historias';
  let lastFile = localStorage.getItem(STORAGE_KEYS.LAST_FILE);

  if (token && repo && lastFile) {
    if (!lastFile.includes('/')) {
      lastFile = `${folder}/${lastFile}`;
      localStorage.setItem(STORAGE_KEYS.LAST_FILE, lastFile);
      log(`Migrando LAST_FILE antigo para caminho completo: ${lastFile}`, 'info');
    }
    log(`Auto-carregando último arquivo: ${lastFile}`, 'info');
    setTimeout(() => loadFile(lastFile), 300);
  }
});
