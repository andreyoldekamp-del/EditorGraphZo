<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphZo Editor v3.3 // CYBERPUNK FORMAT-SYNC</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Inter:wght@400;600&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-dark: #050508;
    --bg-panel: #0d0e17;
    --bg-input: #121320;
    --neon-cyan: #00f3ff;
    --neon-magenta: #ff0055;
    --neon-yellow: #fcee0a;
    --neon-green: #00ff66;
    --text-main: #e0e6ed;
    --text-dim: #7a8291;
    --border-glow: 0 0 8px rgba(0, 243, 255, 0.4);
    --border-magenta: 0 0 8px rgba(255, 0, 85, 0.4);
    --radius: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.03) 0%, transparent 80%),
      linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 24px 24px, 24px 24px;
  }

  header {
    background: linear-gradient(90deg, var(--bg-panel) 0%, rgba(255, 0, 85, 0.15) 100%);
    border-bottom: 2px solid var(--neon-magenta);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(255, 0, 85, 0.25);
    z-index: 10;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--neon-cyan);
    text-shadow: 0 0 12px var(--neon-cyan);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--neon-yellow);
    background: rgba(0, 0, 0, 0.4);
    padding: 6px 14px;
    border: 1px solid rgba(252, 238, 10, 0.3);
    border-radius: var(--radius);
  }

  .pulse {
    width: 10px;
    height: 10px;
    background: var(--neon-green);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--neon-green);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.25); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* BARRA DE ABAS MOBILE */
  .mobile-tab-bar {
    display: none;
    background: var(--bg-panel);
    border-bottom: 1px solid rgba(0, 243, 255, 0.3);
    padding: 8px 12px;
    gap: 10px;
    flex-shrink: 0;
  }

  .mobile-tab-btn {
    flex: 1;
    padding: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: bold;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(0, 243, 255, 0.3);
    color: var(--text-dim);
    border-radius: var(--radius);
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
  }

  .mobile-tab-btn.active {
    background: rgba(0, 243, 255, 0.15);
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: var(--border-glow);
  }

  .main-container { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 330px;
    background: var(--bg-panel);
    border-right: 1px solid rgba(0, 243, 255, 0.2);
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex-shrink: 0;
  }

  .panel {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 243, 255, 0.3);
    padding: 14px;
    position: relative;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  }

  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    color: var(--neon-magenta);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px dashed rgba(255, 0, 85, 0.5);
    padding-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  label {
    display: block;
    font-size: 0.72rem;
    color: var(--neon-cyan);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid rgba(0, 243, 255, 0.4);
    color: var(--text-main);
    padding: 8px 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    margin-bottom: 10px;
    outline: none;
    transition: all 0.25s ease-in-out;
    border-radius: 2px;
  }

  input:focus, select:focus {
    border-color: var(--neon-cyan);
    box-shadow: var(--border-glow);
    background: #16182a;
  }

  .btn-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  button {
    background: transparent;
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    padding: 8px 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 2px;
  }

  button:hover { background: var(--neon-cyan); color: var(--bg-dark); box-shadow: var(--border-glow); }

  button.btn-magenta { border-color: var(--neon-magenta); color: var(--neon-magenta); }
  button.btn-magenta:hover { background: var(--neon-magenta); color: var(--bg-dark); box-shadow: var(--border-magenta); }

  button.btn-yellow { border-color: var(--neon-yellow); color: var(--neon-yellow); }
  button.btn-yellow:hover { background: var(--neon-yellow); color: var(--bg-dark); box-shadow: 0 0 10px var(--neon-yellow); }

  button.btn-green { border-color: var(--neon-green); color: var(--neon-green); }
  button.btn-green:hover { background: var(--neon-green); color: var(--bg-dark); box-shadow: 0 0 10px var(--neon-green); }

  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:disabled:hover { background: transparent; color: inherit; box-shadow: none; }

  .editor-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 14px;
    overflow: hidden;
    gap: 10px;
    min-width: 0;
  }

  /* ESTILOS DE BUSCA DENTRO DO PAINEL LATERAL */
  .search-widget {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .search-nav-btn {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--neon-cyan) !important;
    color: var(--neon-cyan) !important;
    width: 32px;
    height: 32px;
    padding: 0 !important;
    font-size: 0.75rem;
  }
  .search-nav-btn:hover:not(:disabled) {
    background: var(--neon-cyan) !important;
    color: var(--bg-dark) !important;
  }

  .search-highlight-toggle {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--neon-magenta) !important;
    color: var(--neon-magenta) !important;
    width: 32px;
    height: 32px;
    padding: 0 !important;
    font-size: 0.75rem;
  }
  .search-highlight-toggle.active {
    background: var(--neon-magenta) !important;
    color: #fff !important;
  }
  .search-highlight-toggle:hover:not(:disabled) { background: var(--neon-magenta) !important; color: #fff !important; }

  .search-counter {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.78rem;
    color: var(--neon-green);
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 255, 102, 0.4);
    padding: 6px 10px;
    border-radius: var(--radius);
    text-align: center;
    letter-spacing: 1px;
    flex: 1;
  }

  .search-info {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .editor-info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.6);
    border-left: 3px solid var(--neon-cyan);
    border-right: 1px solid rgba(0, 243, 255, 0.2);
    flex-shrink: 0;
  }

  .editor-container {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  #editor {
    flex: 1;
    background: rgba(5, 5, 8, 0.85);
    border: 1px solid rgba(0, 243, 255, 0.3);
    padding: 24px;
    color: var(--text-main);
    font-size: 16px;
    line-height: 1.7;
    overflow-y: auto;
    outline: none;
    position: relative;
    scroll-behavior: smooth;
    word-wrap: break-word;
  }

  #editor:focus {
    border-color: var(--neon-cyan);
    box-shadow: inset 0 0 25px rgba(0, 243, 255, 0.08);
  }

  #editor * { max-width: 100%; }

  #rawHtmlViewer {
    display: none;
    flex: 1;
    background: #020204;
    border: 1px solid var(--neon-magenta);
    padding: 20px;
    color: var(--neon-cyan);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    resize: none;
    white-space: pre-wrap;
    overflow-y: auto;
  }

  #editor .search-highlight {
    background: rgba(252, 238, 10, 0.25) !important;
    color: var(--neon-yellow) !important;
    border-bottom: 2px solid var(--neon-yellow);
    padding: 0 2px;
    border-radius: 2px;
    text-shadow: 0 0 5px var(--neon-yellow);
  }

  #editor .search-highlight.active-match {
    background: var(--neon-magenta) !important;
    color: #ffffff !important;
    border-bottom: 2px solid #ffffff;
    text-shadow: 0 0 10px #ffffff;
    box-shadow: 0 0 15px var(--neon-magenta);
  }

  /* ESTILOS DE FORMATAÇÃO DENTRO DO PAINEL LATERAL */
  .format-toolbar-sidebar {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .format-buttons-row {
    display: flex;
    gap: 4px;
    justify-content: space-between;
  }

  .fmt-btn {
    flex: 1;
    height: 36px;
    padding: 0 !important;
    font-size: 0.9rem;
    border-color: var(--neon-cyan) !important;
    color: var(--neon-cyan) !important;
  }
  .fmt-btn:hover { background: var(--neon-cyan) !important; color: var(--bg-dark) !important; }
  .fmt-btn.active {
    background: var(--neon-cyan) !important;
    color: var(--bg-dark) !important;
    box-shadow: var(--border-glow);
  }

  .btn-apply-fmt {
    border-color: var(--neon-green) !important;
    color: var(--neon-green) !important;
    padding: 8px 12px !important;
    font-weight: bold;
    letter-spacing: 1px;
    flex: 1;
    animation: glow-green 2s infinite;
  }
  .btn-apply-fmt:hover { background: var(--neon-green) !important; color: var(--bg-dark) !important; }

  @keyframes glow-green {
    0%, 100% { box-shadow: 0 0 6px rgba(0, 255, 102, 0.4); }
    50% { box-shadow: 0 0 16px rgba(0, 255, 102, 0.8); }
  }

  .btn-clear-fmt {
    border-color: var(--neon-magenta) !important;
    color: var(--neon-magenta) !important;
    padding: 8px 12px !important;
    font-weight: bold;
    letter-spacing: 1px;
    flex: 1;
    animation: glow-magenta 2s infinite;
  }
  .btn-clear-fmt:hover { background: var(--neon-magenta) !important; color: #fff !important; }

  @keyframes glow-magenta {
    0%, 100% { box-shadow: 0 0 6px rgba(255, 0, 85, 0.4); }
    50% { box-shadow: 0 0 16px rgba(255, 0, 85, 0.8); }
  }

  .btn-nav-top,
  .btn-nav-bottom {
    flex: 1;
    padding: 8px 12px;
    font-size: 0.85rem;
    height: 36px;
  }

  .btn-nav-top {
    border-color: var(--neon-cyan) !important;
    color: var(--neon-cyan) !important;
  }
  .btn-nav-top:hover {
    background: var(--neon-cyan) !important;
    color: var(--bg-dark) !important;
    box-shadow: var(--border-glow);
  }

  .btn-nav-bottom {
    border-color: var(--neon-green) !important;
    color: var(--neon-green) !important;
  }
  .btn-nav-bottom:hover {
    background: var(--neon-green) !important;
    color: var(--bg-dark) !important;
    box-shadow: 0 0 10px var(--neon-green);
  }

  .toast-bar {
    padding: 8px 12px;
    font-size: 0.8rem;
    border-radius: var(--radius);
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    word-break: break-word;
  }
  .toast-info { background: rgba(0, 243, 255, 0.15); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }
  .toast-success { background: rgba(0, 255, 102, 0.15); border: 1px solid var(--neon-green); color: var(--neon-green); }
  .toast-error { background: rgba(255, 0, 85, 0.15); border: 1px solid var(--neon-magenta); color: var(--neon-magenta); }

  .debug-box {
    margin-top: 10px;
    background: #020204;
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    padding: 8px 10px;
    border: 1px solid rgba(0, 255, 102, 0.3);
    border-radius: var(--radius);
    max-height: 140px;
    overflow-y: auto;
    line-height: 1.45;
    display: none;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--neon-magenta); }

  @media (max-width: 850px) {
    html, body {
      height: 100vh;
      overflow: hidden;
    }
    .mobile-tab-bar {
      display: flex;
    }
    .main-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: none;
      border: none;
      padding: 14px;
      overflow-y: auto;
    }
    .sidebar.mobile-active {
      display: flex;
    }
    .editor-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: none;
      padding: 10px;
      overflow: hidden;
    }
    .editor-wrapper.mobile-active {
      display: flex;
    }
    .editor-container {
      flex: 1;
      min-height: 0;
    }
    #editor {
      height: 100%;
      padding: 14px;
      font-size: 15px;
    }
    header { padding: 8px 12px; }
    header h1 { font-size: 1rem; letter-spacing: 1px; }
    .status-indicator { font-size: 0.68rem; padding: 4px 10px; }
  }
</style>
</head>
<body>

<header>
  <h1><i class="fa-solid fa-terminal"></i> GRAPHZO EDITOR <span style="color: var(--neon-magenta);">v3.3</span></h1>
  <div class="status-indicator">
    <div class="pulse" id="statusPulse"></div>
    <span id="statusText">NEURAL LINK ACTIVE</span>
  </div>
</header>

<!-- BARRA DE ABAS PARA DISPOSITIVOS MÓVEIS -->
<div class="mobile-tab-bar" id="mobileTabBar">
  <button class="mobile-tab-btn active" id="tabBtnEditor" onclick="switchMobileTab('editor')">
    <i class="fa-solid fa-pen-to-square"></i> 📝 EDITOR & LEITURA
  </button>
  <button class="mobile-tab-btn" id="tabBtnConfig" onclick="switchMobileTab('config')">
    <i class="fa-solid fa-gears"></i> ⚙️ CONFIGURAÇÕES
  </button>
</div>

<div class="main-container">

  <!-- ABA / PAINEL DE CONFIGURAÇÕES (SIDEBAR) -->
  <aside class="sidebar mobile-active" id="sidebarPanel">

    <!-- CONEXÃO GITHUB -->
    <div class="panel">
      <div class="panel-title"><i class="fa-brands fa-github"></i> // CONEXÃO GITHUB</div>

      <label><i class="fa-solid fa-key"></i> Token Number</label>
      <input type="password" id="ghToken" placeholder="Cole o token do GitHub..." onchange="persistConfig()">

      <label><i class="fa-solid fa-box-archive"></i> Repositório</label>
      <input type="text" id="ghRepo" placeholder="usuario/repositorio" value="andreyoldekamp-del/GraphZoBackup" onchange="persistConfig()">

      <label><i class="fa-solid fa-folder"></i> Pasta</label>
      <input type="text" id="ghFolder" placeholder="historias" value="historias" onchange="persistConfig()">

      <label><i class="fa-solid fa-list-check"></i> Selecionar da Pasta</label>
      <select id="ghFileSelect" onchange="onSelectFileChange()">
        <option value="">-- Clique em Listar --</option>
      </select>

      <div class="btn-group">
        <button onclick="listFiles()"><i class="fa-solid fa-rotate"></i> Listar</button>
        <button onclick="loadFile()" class="btn-magenta"><i class="fa-solid fa-cloud-arrow-down"></i> Carregar</button>
        <button onclick="saveFile()" class="btn-yellow" id="btnSaveGh"><i class="fa-solid fa-cloud-arrow-up"></i> Salvar no GitHub</button>
        <button onclick="deleteFile()" class="btn-magenta" title="Deletar arquivo do GitHub permanentemente"><i class="fa-solid fa-trash-can"></i> Deletar</button>
      </div>

      <div id="toastGh" class="toast-bar"></div>
    </div>

    <!-- BUSCA NEURAL (Movida para Configurações) -->
    <div class="panel">
      <div class="panel-title"><i class="fa-solid fa-magnifying-glass"></i> // BUSCA NEURAL</div>
      <div class="search-widget">
        <div style="display: flex; gap: 6px;">
          <input type="text" id="searchInput" placeholder="Palavra para localizar..." autocomplete="off" spellcheck="false" style="margin: 0;">
          <button onclick="clearSearchWidget()" class="btn-magenta" title="Limpar busca (X)" style="padding: 0 10px; margin: 0;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <span class="search-counter" id="searchCounter">0/0</span>
          <button class="search-nav-btn" id="btnSearchPrev" title="Anterior (Shift+Enter)" disabled><i class="fa-solid fa-chevron-up"></i></button>
          <button class="search-nav-btn" id="btnSearchNext" title="Próximo (Enter)" disabled><i class="fa-solid fa-chevron-down"></i></button>
          <button class="search-highlight-toggle active" id="btnToggleHighlight" title="Alternar realce"><i class="fa-solid fa-highlighter"></i></button>
        </div>
        <div class="search-info" id="searchInfo">Aguardando termo...</div>
      </div>
    </div>

    <!-- FORMATAÇÃO E ESTILO (Movida para Configurações) -->
    <div class="panel">
      <div class="panel-title"><i class="fa-solid fa-wand-magic-sparkles"></i> // FORMATAÇÃO</div>
      <div class="format-toolbar-sidebar">
        <div class="format-buttons-row">
          <button class="fmt-btn" id="fmtBold" title="Negrito (Ctrl+B)"><i class="fa-solid fa-bold"></i></button>
          <button class="fmt-btn" id="fmtItalic" title="Itálico (Ctrl+I)"><i class="fa-solid fa-italic"></i></button>
          <button class="fmt-btn" id="fmtUnderline" title="Sublinhado (Ctrl+U)"><i class="fa-solid fa-underline"></i></button>
          <button class="fmt-btn" id="fmtStrike" title="Riscado"><i class="fa-solid fa-strikethrough"></i></button>
        </div>

        <div>
          <label>Fonte</label>
          <select id="fontFamily">
            <option value="'Share Tech Mono', monospace">Cyber Mono</option>
            <option value="'Comfortaa', cursive">Comfortaa</option>
            <option value="Inter, sans-serif">Inter</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="'Courier New', monospace">Courier New</option>
          </select>
        </div>

        <div>
          <label>Tamanho</label>
          <select id="fontSize">
            <option value="12px">12 px</option>
            <option value="14px">14 px</option>
            <option value="16px" selected>16 px</option>
            <option value="18px">18 px</option>
            <option value="20px">20 px</option>
            <option value="24px">24 px</option>
          </select>
        </div>

        <div style="display: flex; gap: 8px;">
          <div style="flex: 1;">
            <label>Cor Texto</label>
            <input type="color" id="textColor" value="#e0e6ed" style="height: 34px; padding: 2px; cursor: pointer; background: var(--bg-input);">
          </div>
          <div style="flex: 1;">
            <label>Fundo</label>
            <input type="color" id="bgColor" value="#050508" style="height: 34px; padding: 2px; cursor: pointer; background: var(--bg-input);">
          </div>
        </div>

        <div class="format-buttons-row" style="margin-top: 4px;">
          <button class="btn-apply-fmt" id="btnApplyFormat" title="Aplicar formatação">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Aplicar
          </button>
          <button class="btn-clear-fmt" id="btnClearFormat" title="Remover formatação">
            <i class="fa-solid fa-eraser"></i> Limpar
          </button>
        </div>

        <div class="format-buttons-row">
          <button class="btn-nav-top" onclick="scrollToTop()" title="Ir para o início"><i class="fa-solid fa-angles-up"></i> Topo</button>
          <button class="btn-nav-bottom" onclick="scrollToBottom()" title="Ir para o fim"><i class="fa-solid fa-angles-down"></i> Fim</button>
        </div>
      </div>
    </div>

    <!-- CONTROLES LOCAIS -->
    <div class="panel">
      <div class="panel-title"><i class="fa-solid fa-microchip"></i> // CONTROLES LOCAIS</div>
      <input type="file" id="localFileInput" style="display:none;" accept=".html,.xhtml,.txt,.md" onchange="handleLocalFile(event)">

      <div class="btn-group">
        <button onclick="document.getElementById('localFileInput').click()"><i class="fa-solid fa-folder-open"></i> Abrir PC</button>
        <button onclick="downloadPC()"><i class="fa-solid fa-download"></i> Baixar PC</button>
        <button onclick="toggleRawCode()"><i class="fa-solid fa-code"></i> HTML Bruto</button>
        <button onclick="clearEditor()" class="btn-magenta" title="Apagar todo o conteúdo e resetar formatação">
          <i class="fa-solid fa-trash"></i> Limpar Editor
        </button>
      </div>

      <div style="margin-top: 14px; font-size: 0.73rem; color: var(--text-dim); border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px;">
        <strong style="color: var(--neon-cyan);">METADADOS DO LIVRO:</strong><br>
        Nome: <span id="infoName" style="color:#fff;">-</span><br>
        SHA: <span id="infoSHA" style="color:var(--neon-yellow);">Não gravado</span>
      </div>

      <div id="debugConsole" class="debug-box"></div>
    </div>

  </aside>

  <!-- ÁREA DE EDIÇÃO E LEITURA 100% LIMPA -->
  <main class="editor-wrapper mobile-active" id="editorWrapperPanel">

    <div class="editor-info-bar">
      <span>LIVRO ATIVO: <strong id="currentFileName" style="color: var(--neon-cyan);">nenhum_livro_aberto.html</strong></span>
      <span id="editorStatusText" style="color: var(--neon-yellow);">PRONTO</span>
    </div>

    <div class="editor-container">
      <div id="editor" contenteditable="true" spellcheck="false"></div>
      <textarea id="rawHtmlViewer" placeholder="Código HTML/XHTML bruto..."></textarea>
    </div>

  </main>
</div>

<script>
/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
const state = {
  sha: '',
  path: '',
  fileName: '',
  isRawView: false,
  searchTerm: '',
  searchHits: [],
  searchIndex: -1,
  highlightAll: true,
  savedRange: null
};

const STORAGE_KEYS = {
  TOKEN: 'graphzo_cyber_token',
  REPO: 'graphzo_cyber_repo',
  FOLDER: 'graphzo_cyber_folder',
  LAST_FILE: 'graphzo_cyber_last_file'
};

/* ============================================================
   CONTROLE DE ABAS MOBILE
   ============================================================ */
function switchMobileTab(tabName) {
  const sidebar = document.getElementById('sidebarPanel');
  const editorWrapper = document.getElementById('editorWrapperPanel');
  const btnEditor = document.getElementById('tabBtnEditor');
  const btnConfig = document.getElementById('tabBtnConfig');

  if (tabName === 'editor') {
    sidebar.classList.remove('mobile-active');
    editorWrapper.classList.add('mobile-active');
    btnEditor.classList.add('active');
    btnConfig.classList.remove('active');
  } else {
    editorWrapper.classList.remove('mobile-active');
    sidebar.classList.add('mobile-active');
    btnConfig.classList.add('active');
    btnEditor.classList.remove('active');
  }
}

/* ============================================================
   LOG / DEBUG
   ============================================================ */
function log(msg, type = 'info') {
  const box = document.getElementById('debugConsole');
  if (!box) return;
  box.style.display = 'block';
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.textContent = `[${time}] ${msg}`;
  line.style.color = type === 'error' ? 'var(--neon-magenta)' : type === 'ok' ? 'var(--neon-green)' : 'var(--neon-cyan)';
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
  console.log(`[GraphZo] ${msg}`);
}

function showToast(msg, type = 'info') {
  const el = document.getElementById('toastGh');
  if (!el) return;
  el.className = `toast-bar toast-${type}`;
  const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info';
  el.innerHTML = `<i class="fa-solid ${icon}"></i> ${msg}`;
  el.style.display = 'flex';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function setStatus(text, color) {
  const el = document.getElementById('statusText');
  if (el) {
    el.textContent = text;
    el.style.color = color || 'var(--neon-yellow)';
  }
}

/* ============================================================
   PERSISTÊNCIA
   ============================================================ */
function persistConfig() {
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const folder = document.getElementById('ghFolder').value.trim();
  if (token) localStorage.setItem(STORAGE_KEYS.TOKEN, token);
  if (repo) localStorage.setItem(STORAGE_KEYS.REPO, repo);
  if (folder) localStorage.setItem(STORAGE_KEYS.FOLDER, folder);
}

function loadPersistedConfig() {
  const t = localStorage.getItem(STORAGE_KEYS.TOKEN);
  const r = localStorage.getItem(STORAGE_KEYS.REPO);
  const f = localStorage.getItem(STORAGE_KEYS.FOLDER);
  if (t) document.getElementById('ghToken').value = t;
  if (r) document.getElementById('ghRepo').value = r;
  if (f) document.getElementById('ghFolder').value = f;
}

/* ============================================================
   BASE64 → UTF-8
   ============================================================ */
function safeBase64Decode(b64) {
  const clean = String(b64).replace(/\s/g, '');
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  let text = new TextDecoder('utf-8').decode(bytes);
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  return text;
}

/* ============================================================
   NORMALIZAÇÃO DE CORES ESCURAS
   ============================================================ */
function normalizeDarkColors(container) {
  if (!container) return;
  const DARK_THRESHOLD = 180;
  const LIGHT_REPLACEMENT = '#e0e6ed';
  const BG_REPLACEMENT = 'transparent';

  function parseRgb(str) {
    if (!str) return null;
    const m = str.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+)\s*)?\)/i);
    if (!m) return null;
    return { r: +m[1], g: +m[2], b: +m[3], a: m[4] !== undefined ? +m[4] : 1 };
  }
  function parseHex(str) {
    if (!str) return null;
    const m = str.trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
    if (!m) return null;
    let hex = m[1];
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    return {
      r: parseInt(hex.substring(0, 2), 16),
      g: parseInt(hex.substring(2, 4), 16),
      b: parseInt(hex.substring(4, 6), 16)
    };
  }
  function luminance(str) {
    const rgb = parseRgb(str) || parseHex(str);
    if (!rgb) return null;
    return 0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b;
  }
  function fixElement(el) {
    try {
      if (!el || el.nodeType !== 1) return;
      if (el === container) return;
      if (el.tagName === 'STYLE' || el.tagName === 'SCRIPT') return;
      const computed = window.getComputedStyle(el);
      const colorLum = luminance(computed.color);
      const bgLum = luminance(computed.backgroundColor);
      if (colorLum !== null && colorLum < DARK_THRESHOLD) el.style.color = LIGHT_REPLACEMENT;
      if (bgLum !== null && bgLum < DARK_THRESHOLD) {
        const bg = parseRgb(computed.backgroundColor);
        if (bg && bg.a > 0.05) el.style.backgroundColor = BG_REPLACEMENT;
      }
      if (el.tagName === 'FONT' && el.hasAttribute('color')) {
        const fLum = luminance(el.getAttribute('color'));
        if (fLum !== null && fLum < DARK_THRESHOLD) {
          el.removeAttribute('color');
          el.style.color = LIGHT_REPLACEMENT;
        }
      }
    } catch (e) {}
  }
  const all = Array.from(container.querySelectorAll('*'));
  const BATCH = 250;
  for (let i = 0; i < all.length; i += BATCH) {
    all.slice(i, i + BATCH).forEach(fixElement);
  }
  fixElement(container);
}

/* ============================================================
   EXTRATOR DE <body>
   ============================================================ */
function extractReadableHtml(raw) {
  if (!raw) return '';
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(raw, 'application/xhtml+xml');
    if (!doc.querySelector('parsererror')) {
      const body = doc.querySelector('body');
      if (body && body.innerHTML.trim()) return body.innerHTML;
      const html = doc.querySelector('html');
      if (html && html.innerHTML.trim()) return html.innerHTML;
    }
  } catch (e) {}
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(raw, 'text/html');
    const body = doc.querySelector('body');
    if (body && body.innerHTML.trim()) return body.innerHTML;
  } catch (e) {}
  return raw;
}

function updateFileLabels() {
  document.getElementById('currentFileName').textContent = state.fileName || 'nenhum_livro_aberto.html';
  document.getElementById('infoName').textContent = state.fileName || '-';
}

/* ============================================================
   GARCAS / GITHUB E LOCAL
   ============================================================ */
async function listFiles() {
  persistConfig();
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const folder = document.getElementById('ghFolder').value.trim();
  if (!token) { showToast('Insira o token do GitHub.', 'error'); return; }

  showToast('Listando arquivos...', 'info');
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${folder}`, {
      headers: { 'Authorization': `token ${token}` }
    });
    if (!res.ok) throw new Error(`Erro API GitHub: ${res.status}`);
    const data = await res.json();
    const select = document.getElementById('ghFileSelect');
    select.innerHTML = '<option value="">-- Selecione um arquivo --</option>';
    if (Array.isArray(data)) {
      data.forEach(item => {
        if (item.type === 'file' && (item.name.endsWith('.html') || item.name.endsWith('.htm') || item.name.endsWith('.txt') || item.name.endsWith('.md'))) {
          const opt = document.createElement('option');
          opt.value = item.path;
          opt.textContent = item.name;
          select.appendChild(opt);
        }
      });
      showToast('Arquivos listados com sucesso!', 'success');
      log('Arquivos listados do GitHub.', 'ok');
    }
  } catch (e) {
    showToast(e.message, 'error');
    log(e.message, 'error');
  }
}

async function loadFile() {
  persistConfig();
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const select = document.getElementById('ghFileSelect');
  const path = select.value;
  if (!token || !path) { showToast('Selecione um arquivo válido.', 'error'); return; }

  showToast('Carregando arquivo...', 'info');
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      headers: { 'Authorization': `token ${token}` }
    });
    if (!res.ok) throw new Error(`Erro ao baixar: ${res.status}`);
    const data = await res.json();
    const decoded = safeBase64Decode(data.content);

    state.sha = data.sha;
    state.path = data.path;
    state.fileName = data.name;
    document.getElementById('infoSHA').textContent = data.sha.substring(0, 7) + '...';

    const editor = document.getElementById('editor');
    editor.innerHTML = extractReadableHtml(decoded);
    normalizeDarkColors(editor);
    updateFileLabels();

    localStorage.setItem(STORAGE_KEYS.LAST_FILE, path);
    showToast(`Arquivo "${data.name}" carregado!`, 'success');
    log(`Carregado: ${data.name}`, 'ok');

    if (window.innerWidth <= 850) {
      switchMobileTab('editor');
    }
  } catch (e) {
    showToast(e.message, 'error');
    log(e.message, 'error');
  }
}

async function saveFile() {
  persistConfig();
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  if (!token || !state.path) { showToast('Nenhum arquivo ativo para salvar no GitHub.', 'error'); return; }

  showToast('Salvando no GitHub...', 'info');
  try {
    const editor = document.getElementById('editor');
    const contentHtml = editor.innerHTML;
    const fullDocument = `<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="UTF-8">\n<title>${state.fileName}</title>\n</head>\n<body>\n${contentHtml}\n</body>\n</html>`;
    const encoded = btoa(unescape(encodeURIComponent(fullDocument)));

    const bodyData = {
      message: `GraphZo Sync: update ${state.fileName}`,
      content: encoded,
      sha: state.sha
    };

    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${state.path}`, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(bodyData)
    });

    if (!res.ok) {
      const errJson = await res.json();
      throw new Error(errJson.message || `Erro ao salvar: ${res.status}`);
    }

    const data = await res.json();
    state.sha = data.content.sha;
    document.getElementById('infoSHA').textContent = state.sha.substring(0, 7) + '...';
    showToast('Salvo com sucesso no GitHub!', 'success');
    log(`Salvo: ${state.path}`, 'ok');
  } catch (e) {
    showToast(e.message, 'error');
    log(e.message, 'error');
  }
}

async function deleteFile() {
  persistConfig();
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  if (!token || !state.path) { showToast('Nenhum arquivo selecionado para deletar.', 'error'); return; }
  if (!confirm(`Tem certeza que deseja deletar permanentemente "${state.fileName}" do GitHub?`)) return;

  showToast('Deletando arquivo...', 'info');
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${state.path}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `GraphZo Sync: delete ${state.fileName}`,
        sha: state.sha
      })
    });
    if (!res.ok) throw new Error(`Erro ao deletar: ${res.status}`);
    showToast('Arquivo deletado com sucesso!', 'success');
    log(`Deletado: ${state.path}`, 'ok');
    clearEditor();
    listFiles();
  } catch (e) {
    showToast(e.message, 'error');
    log(e.message, 'error');
  }
}

function handleLocalFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const raw = e.target.result;
    state.fileName = file.name;
    state.path = file.name;
    state.sha = '';
    document.getElementById('infoSHA').textContent = 'Local (Não gravado)';
    const editor = document.getElementById('editor');
    editor.innerHTML = extractReadableHtml(raw);
    normalizeDarkColors(editor);
    updateFileLabels();
    showToast(`Arquivo local "${file.name}" aberto!`, 'success');
    log(`Aberto local: ${file.name}`, 'ok');
    if (window.innerWidth <= 850) {
      switchMobileTab('editor');
    }
  };
  reader.readAsText(file);
}

function downloadPC() {
  const editor = document.getElementById('editor');
  const contentHtml = editor.innerHTML;
  const fullDocument = `<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="UTF-8">\n<title>${state.fileName || 'documento'}</title>\n</head>\n<body>\n${contentHtml}\n</body>\n</html>`;
  const blob = new Blob([fullDocument], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = state.fileName || 'documento.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Download iniciado!', 'success');
}

function toggleRawCode() {
  const editor = document.getElementById('editor');
  const rawViewer = document.getElementById('rawHtmlViewer');
  state.isRawView = !state.isRawView;
  if (state.isRawView) {
    rawViewer.value = editor.innerHTML;
    editor.style.display = 'none';
    rawViewer.style.display = 'block';
    showToast('Modo HTML Bruto ativado', 'info');
  } else {
    editor.innerHTML = rawViewer.value;
    rawViewer.style.display = 'none';
    editor.style.display = 'block';
    showToast('Modo Editor Visual ativado', 'info');
  }
}

function clearEditor() {
  if (!confirm('Deseja limpar todo o conteúdo do editor?')) return;
  document.getElementById('editor').innerHTML = '';
  state.fileName = '';
  state.path = '';
  state.sha = '';
  updateFileLabels();
  document.getElementById('infoSHA').textContent = 'Não gravado';
  showToast('Editor limpo.', 'info');
}

function scrollToTop() {
  const editor = document.getElementById('editor');
  editor.scrollTop = 0;
}

function scrollToBottom() {
  const editor = document.getElementById('editor');
  editor.scrollTop = editor.scrollHeight;
}

function onSelectFileChange() {}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  loadPersistedConfig();
  updateFileLabels();
  log('GraphZo Editor v3.3 inicializado.', 'ok');
});
</script>
</body>
</html>
